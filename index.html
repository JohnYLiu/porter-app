  // that gets rebuilt is the Issue-form bug all over again.
  $("view").querySelectorAll(".mycar[data-detail]").forEach(panel =>
    panel.onclick = (e) => {
      // Anything that already does something keeps doing it. Only the space
      // around the controls opens the detail view.
      if (e.target.closest("button")) return;
      openDetail(panel.dataset.detail);
    });

  $("view").querySelectorAll("[data-car]").forEach(b =>
    b.onclick = async () => {
      const r = requests.find(x => x.id === b.dataset.car);
      if (!r) return;
      // Disable every button on this panel, not just the one pressed: two taps
      // on "delivered" would send the second into a car that is already done.
      b.closest(".mycar").querySelectorAll("button").forEach(x => x.disabled = true);
      try {
        await api(`/rest/v1/rpc/${b.dataset.do}_request`, { method: "POST", body: { p_id: r.id } });
      } catch (e) {
        alert(e.message);
      }
      await loadRequests();
      render();
    });
}

/* --- Swipe left to act ------------------------------------------------------
 *
 * A porter has a key tag in one hand. Reaching a card, waiting for the sheet,
 * finding the button and tapping it is four deliberate acts for the two things
 * they do all day: take the next car, and say it arrived. One swipe does either.
 *
 * Touch only — these listeners fire on nothing else, so the desktop UI is
 * untouched and every button still works exactly as before.
 *
 * The rules, learned from dragToDismiss above:
 *   - Decide direction ONCE, from the first few pixels, and never take over a
 *     gesture that turned out to be a scroll. A queue you cannot scroll past is
 *     worse than no swipe at all.
 *   - Commit on distance OR speed, so a short flick works as well as a long pull.
 *   - Only leftward. Rightward does nothing, deliberately: there is no second
 *     action to discover, and a card that slides both ways invites hunting.
 */
let swipeActive = false;        // suppresses the 3s poll mid-gesture

function bindSwipes() {
  $("view").querySelectorAll(".swipe-wrap").forEach(wrap => {
    const el = wrap.querySelector(".card, .mycar");
    if (!el) return;
    const action = wrap.dataset.swipe || null;         // leftward; may be absent
    const endLbl   = wrap.querySelector(".swipe-action.end");
    const startLbl = wrap.querySelector(".swipe-action.start");

    const COMMIT_DISTANCE = 96;     // px, for a slow deliberate pull
    const COMMIT_VELOCITY = 0.6;    // px per ms, for a quick flick
    const MIN_FLICK       = 48;     // px a flick must still travel
    const SLOP            = 10;     // px before the direction is decided

    let x0 = 0, y0 = 0, at = 0, dx = 0;
    let tracking = false, decided = false, swiped = false;

    // Which label is showing follows the direction of travel: drag left and the
    // action on the right is uncovered, drag right and the one on the left is.
    const paint = () => {
      el.style.transform = `translateX(${dx}px)`;
      const p = Math.min(1, Math.abs(dx) / COMMIT_DISTANCE).toFixed(2);
      const armed = Math.abs(dx) >= COMMIT_DISTANCE;
      const showing = dx < 0 ? endLbl : startLbl;
      const hidden  = dx < 0 ? startLbl : endLbl;
      if (hidden) { hidden.style.opacity = 0; hidden.classList.remove("armed"); }
      if (showing) { showing.style.opacity = p; showing.classList.toggle("armed", armed); }
    };

    const settle = () => {
      el.style.transition = "transform .18s ease-out";
      el.style.transform = "";
      [endLbl, startLbl].forEach(l => {
        if (!l) return;
        l.style.opacity = 0; l.classList.remove("armed");
      });
    };

    el.addEventListener("touchstart", (e) => {
      if (e.touches.length !== 1) return;
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
      at = Date.now(); dx = 0;
      tracking = true; decided = false; swiped = false;
      el.style.transition = "none";
    }, { passive: true });

    el.addEventListener("touchmove", (e) => {
      if (!tracking) return;
      const ddx = e.touches[0].clientX - x0;
      const ddy = e.touches[0].clientY - y0;

      // Hold off until the finger has committed to a direction. Guessing from
      // the first pixel steals vertical scrolls; every list here is scrollable.
      if (!decided) {
        if (Math.abs(ddx) < SLOP && Math.abs(ddy) < SLOP) return;
        decided = true;
        if (Math.abs(ddx) <= Math.abs(ddy)) { tracking = false; return; }  // it's a scroll
        swipeActive = true;
      }

      // Leftward only exists where there is a left-hand action to run. Rightward
      // always does: every car can be talked about.
      if (ddx < 0 && !action) { dx = 0; paint(); return; }
      dx = ddx;
      e.preventDefault();      // needs passive:false — stops the page rubber-banding
      paint();
    }, { passive: false });

    const end = () => {
      // Cleared before the early return, never after. This flag stops the
      // poller, and a flag that stops the poller must have no path that leaves
      // it set — the History filters froze that way once already.
      swipeActive = false;
      if (!tracking) return;
      tracking = false;
      if (!dx) { settle(); return; }

      // Distance OR speed, but speed still has to go somewhere. Velocity alone
      // let a 20px twitch claim a car, because a short fast movement is a high
      // velocity — and a twitch is exactly what a phone in a pocket produces.
      const travel   = Math.abs(dx);
      const velocity = travel / Math.max(1, Date.now() - at);
      const commit   = travel >= COMMIT_DISTANCE
                    || (travel >= MIN_FLICK && velocity >= COMMIT_VELOCITY);
      const id = el.dataset.id || el.querySelector("[data-car]")?.dataset.car;

      if (!commit) { settle(); return; }
      swiped = true;                            // so the tap that follows is not a tap

      if (dx > 0) {
        // Rightward: go and say something. The card stays where it is — unlike
        // claiming, this does not take it off the list, and sliding it away
        // only to put it back would read as a mistake. The sheet covers it
        // immediately anyway.
        settle();
        openMessage(id);       // MUST be synchronous — see the function
        return;
      }

      el.style.transition = "transform .18s ease-out";
      el.style.transform = "translateX(-100%)";
      if (endLbl) { endLbl.style.opacity = 1; endLbl.classList.add("armed"); }
      swipeAct(action, id);
    };

    el.addEventListener("touchend", end);
    el.addEventListener("touchcancel", end);

    // A finished swipe still ends in a touchend over the card, which the browser
    // turns into a click — opening the detail sheet for the car just claimed.
    //
    // stopImmediatePropagation, not stopPropagation: the handlers that must not
    // run are on THIS element, not on an ancestor, and stopPropagation does
    // nothing about those. The panel's own click handler is one of them, and
    // after a swipe to message it would rebuild the sheet and drop the keyboard
    // that the swipe just raised.
    //
    // Which is also why bindSwipes runs before the handlers it has to beat:
    // same-element listeners fire in the order they were added.
    el.addEventListener("click", (e) => {
      if (!swiped) return;
      swiped = false;
      e.preventDefault(); e.stopImmediatePropagation();
    }, true);
  });
}

/* Open the sheet with the message box already focused and the keyboard up.
 *
 * EVERY LINE OF THIS RUNS SYNCHRONOUSLY, inside the touchend handler, and it
 * has to. iOS only raises the keyboard for a focus() that happens while the
 * user's gesture is still being processed — one await anywhere above the
 * focus() call and the box gets focus with no keyboard, which is precisely the
 * thing this gesture exists to avoid. openDetail renders from data already in
 * memory, so there is nothing here that needs to wait.
 */
function openMessage(id) {
  openDetail(id);
  const box = document.getElementById("msgBox");
  if (!box) return;
  box.focus();
  // No scrollIntoView. It walks every scrollable ancestor including the
  // document, and with a keyboard open iOS gives the document somewhere to go
  // — which it then stayed at after the keyboard closed, leaving the whole app
  // shifted up with its header cut off. Nothing needs scrolling anyway: the
  // sheet is rebuilt at scrollTop 0 and the box is near the top of it.
}

async function swipeAct(action, id) {
  const r = requests.find(x => x.id === id);
  if (!r) return;

  try {
    await api(`/rest/v1/rpc/${action}_request`, { method: "POST", body: { p_id: r.id } });
  } catch (e) {
    // 409 means somebody else claimed it first. Not an error — the queue
    // working. Either way the card comes back, so say why it did.
    alert(e.message);
  }
  await loadRequests();
  render();
}

function empty(icon, title, sub = "") {
  return `<div class="empty"><div class="big">${icon}</div><div>${esc(title)}</div>
          ${sub ? `<div style="font-size:.85rem;margin-top:6px">${esc(sub)}</div>` : ""}</div>`;
}

/* The name and role in the header.
 *
 * Drawn on every render, not once at sign-in. Whether somebody is a service
 * advisor is not a column on their account — it is whether an advisor row
 * points at them — so it cannot be known until the advisor list has loaded,
 * and at sign-in it has not. Written once up there it read "Manager" and then
 * stayed wrong for the rest of the session.
 */
function renderWho() {
  if (!session?.user) return;
  $("whoName").textContent = session.user.name;
  $("whoRole").textContent = roleLabel(session.user);

}

function render() {
  renderWho();
  renderTabs();
  const v = $("view");

  if (tab === "queue") {
    // Whatever this person is currently holding sits at the top — no tab to
    // remember, no navigation mid-delivery. The unclaimed queue follows below,
    // area filters and all.
    const mine = myClaims();

    // Strictly oldest first. No location or route jumps the queue — the top
    // card is always the longest wait.
    const all = byStatus("unclaimed");
    const counts = Object.fromEntries(ZONES.map(z => [z.id, all.filter(r => r.zone === z.id).length]));
    const open = inZone(all);

    v.innerHTML =
      myCarPanels(mine) +
      `<h2 class="title">Unclaimed</h2>` + pushCard() + zoneBar(counts) +
      (open.length
        ? `<p class="sub">Oldest first. ${open.length} waiting.</p>` +
          open.map(r => canClaim() ? swipeWrap(card(r), "Claim", "claim") : card(r)).join("")
        : empty("✓", "Nothing waiting", "Every car in this area has been picked up."));

    bindZoneBar();
    bindSwipes();          // first: its click suppressor has to run before the
    bindMyCarPanels();     // panel handler it is there to cancel
    if ($("enablePush")) $("enablePush").onclick = enablePush;
  }

  else if (tab === "progress") {
    const all = byStatus("claimed");

    // A cashier mostly wants to know about the cars THEY asked for. Everyone
    // else has no use for the distinction, so they never see the switch.
    const scoped = (canIssue() && activeMineOnly)
      ? all.filter(r => r.issued_by === session.user.id)
      : all;

    // Viewing your own requests, the areas are noise: they are all your cars,
    // and each one already says its route on the card. Splitting them by area
    // would be a tap that buys nothing. The switcher only appears once you are
    // looking at everybody's.
    const splitByArea = !(canIssue() && activeMineOnly);

    // Counts follow the filter, so the number on a sub-tab always matches what
    // tapping it would show.
    const counts = Object.fromEntries(ZONES.map(z => [z.id, scoped.filter(r => r.zone === z.id).length]));
    const live = splitByArea ? inZone(scoped) : scoped;

    v.innerHTML = `<h2 class="title">In Progress</h2>` + mineBar(all) +
      (splitByArea ? zoneBar(counts) : "") +
      (live.length
        ? `<p class="sub">${live.length} being delivered right now.</p>` +
          live.map(r => swipeWrap(card(r, { time: "claimed " + stamp(r.claimed_at) }),
                                  null, null)).join("")
        : empty("◷", splitByArea
            ? "Nothing in progress in this area"
            : "None of your cars are on the move"));
    bindZoneBar();
    bindSwipes();
    $("view").querySelectorAll("[data-mine]").forEach(b =>
      b.onclick = () => { activeMineOnly = b.dataset.mine === "1"; render(); });
  }

  else if (tab === "issue") renderIssue();
  else if (tab === "history") renderHistory();
  else if (tab === "settings") renderSettings();
  else if (tab === "admin")   renderAdmin();

  v.querySelectorAll(".card").forEach(c => c.onclick = () => openDetail(c.dataset.id));
}

/* --- Issue --------------------------------------------------------------- */
let issueOrigin = null;
let issueDest   = null;
let issueWash   = false;

// Mirrors the generated `zone` column in db/schema.sql. Shown to the cashier so
// they can see who the request is about to go to before they send it — the
// routing is otherwise invisible, and a cashier who picks the wrong location
// would have no way of noticing.
const zoneFor = (o, d) =>
  (["510", "525"].includes(o) || ["510", "525"].includes(d)) ? "510" : "lower_lot";

function locButtons(kind, selected) {
  return LOCATIONS.map(l =>
    `<button data-${kind}="${l.id}" aria-pressed="${l.id === selected}">` +
    `${esc(l.label)}</button>`).join("");
}

function renderIssue() {
  // A wash stop is meaningless if the wash is already an end of the journey.
  const washNA = issueOrigin === "wash" || issueDest === "wash";

  $("view").innerHTML = `
    <h2 class="title">Issue a Request</h2>

    <label for="car_code">Key tag</label>
    <input id="car_code" type="text" autocomplete="off" autocapitalize="characters"
           spellcheck="false" maxlength="20">
    <div id="tagWho"></div>

    <label>Pick up from</label>
    <div class="seg" id="segOrigin">${locButtons("origin", issueOrigin)}</div>

    <label>Take to</label>
    <div class="seg" id="segDest">${locButtons("dest", issueDest)}</div>

    <div class="checkrow ${washNA ? "disabled" : ""}">
      <input type="checkbox" id="viaWash" ${issueWash && !washNA ? "checked" : ""}
             ${washNA ? "disabled" : ""}>
      <label for="viaWash">Stop at the wash on the way</label>
    </div>
    ${washNA ? `<p class="checkhint">The wash is already one end of this trip.</p>` : ""}

    <div id="routePreview"></div>

    <label for="note">Note <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
    <textarea id="note" maxlength="500" placeholder="Customer name, bay number…"></textarea>

    <button class="btn primary" id="submitReq">Send to porters</button>
    <div id="issueMsg"></div>`;

  // Everything below updates the form IN PLACE. Re-rendering on each tap would
  // blank the car code, advisor and note the cashier has already typed, and
  // picking locations after typing the code is the natural order.
  const paint = () => {
    $("segOrigin").querySelectorAll("[data-origin]").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.origin === issueOrigin)));
    $("segDest").querySelectorAll("[data-dest]").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.dest === issueDest)));

    const na = issueOrigin === "wash" || issueDest === "wash";
    const box = $("viaWash");
    box.disabled = na;
    if (na) { issueWash = false; box.checked = false; }
    box.closest(".checkrow").classList.toggle("disabled", na);

    if (issueOrigin && issueDest) {
      const z = zoneFor(issueOrigin, issueDest);
      $("routePreview").innerHTML =
        `<div class="msg info" style="text-align:center">
           <div class="route" style="font-size:1rem">
             ${routeHtml({ origin: issueOrigin, destination: issueDest, via_wash: issueWash })}
           </div>
           <div style="font-size:.78rem;margin-top:7px;color:var(--dimmer)">
             Goes to ${z === "510" ? "510" : "Lower Lot"} porters
           </div>
         </div>`;
    } else {
      $("routePreview").innerHTML = "";
    }

    // Who the tag belongs to, shown as it is typed. The cashier never picks an
    // advisor now, so this is their only chance to notice a mistyped tag before
    // the car is on its way to the wrong person's customer.
    // Nothing until three characters. One or two is a tag mid-typing, and
    // flashing "N/A" at it before settling on a name is noise. Three is a real
    // answer — that IS a tag with no advisor — so it shows from there.
    const code = $("car_code").value.trim();
    if (code.length < 3) { $("tagWho").innerHTML = ""; return; }
    const a = advisorForCode(code);
    const bad = a === TAG_BAD;
    $("tagWho").innerHTML =
      `<div class="chip" style="--advisor:${esc(a.color)};margin-top:9px;font-size:.9rem">
         <span class="dot"></span>
         <span style="color:${bad ? "var(--danger)" : "var(--dim)"}">${esc(a.name)}</span>
       </div>` +
      (bad ? `<p class="checkhint" style="color:var(--danger)">
                No advisor uses "${esc(code[0].toUpperCase())}". Check the tag.
              </p>` : "");
  };

  $("segOrigin").querySelectorAll("[data-origin]").forEach(b =>
    b.onclick = () => { issueOrigin = b.dataset.origin; paint(); });
  $("segDest").querySelectorAll("[data-dest]").forEach(b =>
    b.onclick = () => { issueDest = b.dataset.dest; paint(); });
  $("viaWash").onchange = (e) => { issueWash = e.target.checked; paint(); };
  $("car_code").addEventListener("input", paint);
  $("submitReq").onclick = submitRequest;

  paint();

  // Straight into the key tag, so issuing a car is type-and-go rather than
  // click, then type.
  //
  // Mouse only, and the test is the POINTER rather than the screen width: what
  // makes this wrong on a phone is not the size of the screen, it is the
  // keyboard that would spring up over the form the moment the tab opened,
  // covering the very buttons the cashier needs next. A narrow window on a
  // laptop should still land in the box; a large tablet should not.
  //
  // Runs on the two occasions this form is drawn — opening the tab, and after a
  // request is sent — and both are moments when the next thing anyone does is
  // type a tag.
  if (matchMedia("(hover: hover) and (pointer: fine)").matches) $("car_code").focus();
}

async function submitRequest() {
  const code = $("car_code").value.trim();
  const note = $("note").value.trim();
  const msg = $("issueMsg");
  msg.innerHTML = "";

  const fail = (t) => { msg.innerHTML = `<div class="msg err">${esc(t)}</div>`; };
  if (!code)        return fail("Enter the key tag.");
  if (!issueOrigin) return fail("Choose where the car is now.");
  if (!issueDest)   return fail("Choose where it needs to go.");

  // An unrecognised first character is warned about, not blocked. A cashier
  // holding a real tag should never be stuck because the advisor list is stale;
  // the request still needs to reach a porter.
  const btn = $("submitReq");
  btn.disabled = true; btn.textContent = "Sending…";
  try {
    await api("/rest/v1/rpc/create_request", { method: "POST", body: {
      p_car_code: code,
      p_origin: issueOrigin,
      p_destination: issueDest,
      p_via_wash: issueWash,
      p_note: note || null,
    }});
    const sentTo = zoneFor(issueOrigin, issueDest) === "510" ? "510" : "Lower Lot";
    await loadRequests();
    issueOrigin = null; issueDest = null; issueWash = false;
    renderIssue();
    $("issueMsg").innerHTML =
      `<div class="msg ok">${esc(code.toUpperCase())} sent to the ${sentTo} porters.</div>`;
  } catch (e) {
    msg.innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = "Send to porters";
  }
}

/* --- Settings ------------------------------------------------------------- */
/* One section for now. The sub-tab bar is here so adding the next one is a
   line rather than a rethink. */
let settingsSection = "notifications";

/* Numbers off the device, because this one only misbehaves on a phone.
 *
 * Two attempts at the jumping tab bar were wrong, and both were wrong because
 * every measurement I had came from a desktop browser that does not reproduce
 * it. This puts the same measurements on the screen of the machine that does.
 * It sits on Settings deliberately — that is one of the tabs that misbehaves.
 * Delete the line and this function once the bar is behaving. */
function viewportReadout() {
  const vv = window.visualViewport;
  const bar = $("tabs").getBoundingClientRect();
  const app = $("app").getBoundingClientRect();
  const n = v => Math.round(v);
  return [
    `win ${n(innerWidth)}x${n(innerHeight)}`,
    `scr ${n(screen.width)}x${n(screen.height)}`,
    `vv ${vv ? n(vv.height) + "@" + n(vv.offsetTop) : "-"}`,
    `cl ${n(document.documentElement.clientHeight)}`,
    `app ${n(app.top)}..${n(app.bottom)}`,
    `bar ${n(bar.top)}..${n(bar.bottom)} h${n(bar.height)}`,
    // The resolved bottom padding, which is where the inset actually shows up.
    `pad ${getComputedStyle($("tabs")).paddingBottom}`,
    `doc ${n(document.documentElement.scrollHeight)}`,
    (matchMedia("(display-mode: standalone)").matches || navigator.standalone)
      ? "standalone" : "browser",
  ].join(" · ");
}

function renderSettings() {
  const u = session.user;
  const note = (t) =>
    t ? `<br><span style="font-size:.76rem;color:var(--dimmer)">${esc(t)}</span>` : "";

  const row = (key, label, sub) => `
    <label class="perm ${u[key] ? "on" : ""}" style="min-height:56px">

    </label>`;

  // One of three, so radios rather than checkboxes — the states are mutually
  // exclusive, and three tick boxes would let somebody choose two of them.
  // Missing means none. An account that predates this setting, or one loaded
  // before the column existed, should show a chosen option rather than three
  // empty circles that look like the screen failed to load.
  const msgPref = u.notify_messages || "none";
  const choice = (value, label, sub) => `
    <label class="perm ${msgPref === value ? "on" : ""}" style="min-height:56px">
      <input type="radio" name="msgpref" data-msg="${value}"
             ${msgPref === value ? "checked" : ""}>
      <span>${esc(label)}${note(sub)}</span>
    </label>`;

  $("view").innerHTML = `
    <h2 class="title">Settings</h2>
    <div class="zonebar">
      <button data-settings="notifications" aria-current="true">Notifications</button>
    </div>

    ${pushCard()}

    <p class="sub">Choose what you want to be told about. Only you can change
       these — nobody else sets them for you.</p>

    <div class="perms" style="grid-template-columns:1fr">
      ${row("notify_lower", "Lower Lot Car Requests", "A request for lower lot porters has been issued")}
      ${row("notify_510", "510 Car Requests", "A request for 510 porters has been issued")}
      ${row("notify_delivered", "My Car Delivered", "A car you requested has arrived")}
    </div>

    <h3 class="setsub">Messages</h3>
    <div class="perms" style="grid-template-columns:1fr">
      ${choice("none", "None", "Never tell me about messages")}
      ${choice("mine", "My cars", "Only cars I requested, or cars I have claimed")}
      ${choice("all",  "Every car", "Any message about any car")}
    </div>

    ${isAdvisorAccount(u) ? `
      <h3 class="setsub">Your customers' cars</h3>
      <p class="sub" style="margin:-6px 0 12px">Cars whose key tag starts with your
         character, whoever raised the request.</p>
      <div class="perms" style="grid-template-columns:1fr">
        ${row("notify_advisor_delivered", "Delivered",
              "A car belonging to one of your customers (according to the key-tag) has arrived")}
        ${row("notify_advisor_messages", "Messages",
              "Somebody has written about a car belonging to one of your customers")}
      </div>` : ""}

    <div id="prefMsg"></div>
    <p class="diag">${esc(viewportReadout())}</p>`;

  if ($("enablePush")) $("enablePush").onclick = enablePush;

  // Every control sends the WHOLE set, not just the one that moved. The RPC
  // writes all six columns, so sending a subset would quietly reset the rest.
  const save = async () => {
    const wanted = {};
    $("view").querySelectorAll("[data-pref]").forEach(b => { wanted[b.dataset.pref] = b.checked; });
    const picked = $("view").querySelector("[data-msg]:checked");
    wanted.notify_messages = picked ? picked.dataset.msg : "none";

    try {
      await api("/rest/v1/rpc/set_notification_preferences", { method: "POST", body: {
        p_510:      !!wanted.notify_510,
        p_lower:    !!wanted.notify_lower,
        p_delivered:!!wanted.notify_delivered,
        p_messages: wanted.notify_messages,
        p_advisor_delivered: !!wanted.notify_advisor_delivered,
        p_advisor_messages:  !!wanted.notify_advisor_messages,
      }});
      Object.assign(session.user, wanted);
      saveSession();
      renderSettings();
    } catch (e) {
      // Re-render FIRST, then write the error into the fresh element. The other
      // way round — which is how this was — the message went into a node that
      // renderSettings replaced a line later, so a failed save silently put the
      // switch back and said nothing about why.
      renderSettings();
      $("prefMsg").innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
    }
  };

  $("view").querySelectorAll("[data-pref], [data-msg]").forEach(c => c.onchange = save);
}

/* --- History ------------------------------------------------------------- */
let hFilters = { code: "", advisor: "", cashier: "", porter: "", order: "desc" };

function renderHistory() {
  const done = requests.filter(r => r.status === "complete" || r.status === "cancelled");

  const names = (key) => [...new Map(done
    .filter(r => r[key]?.name).map(r => [r[key].name, r[key].name])).values()].sort();

  // Substring, not prefix: people remember the end of a tag as often as the
  // start. Codes are stored uppercase, so the needle is raised to match.
  const needle = hFilters.code.trim().toUpperCase();

  let list = done.filter(r =>
    (!needle || r.car_code.includes(needle)) &&
    (!hFilters.advisor || advisorOf(r).name === hFilters.advisor) &&
    (!hFilters.cashier || r.issuer?.name === hFilters.cashier) &&
    (!hFilters.porter  || r.claimer?.name === hFilters.porter));

  list.sort((a, b) => hFilters.order === "desc"
    ? new Date(finishedAt(b)) - new Date(finishedAt(a))
    : new Date(finishedAt(a)) - new Date(finishedAt(b)));

  const sel = (id, label, key, opts) => `
    <select id="${id}" aria-label="${label}">
      <option value="">${label}</option>
      ${opts.map(o => `<option ${hFilters[key] === o ? "selected" : ""}>${esc(o)}</option>`).join("")}
    </select>`;

  $("view").innerHTML = `
    <h2 class="title">History</h2>
    <p class="sub">Finished requests from the last 7 days, most recently finished first.</p>
    <input id="hSearch" type="text" inputmode="search" autocomplete="off"
           placeholder="Search by key tag" value="${esc(hFilters.code)}"
           aria-label="Search by key tag">
    <div class="filters">
      ${sel("fAdvisor", "All advisors", "advisor", names("advisor"))}
      ${sel("fCashier", "All cashiers", "cashier", names("issuer"))}
      ${sel("fPorter",  "All porters",  "porter",  names("claimer"))}
      <select id="fOrder" aria-label="Sort order">
        <option value="desc" ${hFilters.order === "desc" ? "selected" : ""}>Recent first</option>
        <option value="asc"  ${hFilters.order === "asc"  ? "selected" : ""}>Oldest first</option>
      </select>
    </div>` +
    (list.length
      ? list.map(r => card(r, {
          time: dayAndClock(finishedAt(r)),
          meta: r.status === "cancelled"
            ? "Cancelled"
            : `Delivered by ${r.claimer?.name || "—"} · ${minutesTaken(r)}`,
        })).join("")
      : empty("⟲", "Nothing matches", "Try clearing the filters."));

  // Re-rendering on every keystroke destroys the box being typed into, so put
  // the caret back exactly where it was — not at the end, or editing the middle
  // of a tag would throw you to the end after each character.
  const box = $("hSearch");
  box.oninput = (e) => {
    const at = e.target.selectionStart;
    hFilters.code = e.target.value;
    renderHistory();
    const again = $("hSearch");
    again.focus();
    again.setSelectionRange(at, at);
  };

  const bind = (id, key) => $(id).onchange = (e) => {
    hFilters[key] = e.target.value; renderHistory();
  };
  bind("fAdvisor", "advisor"); bind("fCashier", "cashier");
  bind("fPorter", "porter");   bind("fOrder", "order");

  $("view").querySelectorAll(".card").forEach(c => c.onclick = () => openDetail(c.dataset.id));
}

/* When a request LEFT the queue.
 *
 * History is a record of finished work, so this — not created_at — is what it
 * sorts and timestamps by. A car requested at 07:27 and delivered at 08:21 was
 * sorted into the 07:27 position, which buried it under everything requested
 * later, and made a porter who had just delivered five cars unable to find any
 * of them. */
const finishedAt = (r) => r.completed_at || r.cancelled_at || r.created_at;

function minutesTaken(r) {
  if (!r.completed_at) return "—";
  const m = Math.round((new Date(r.completed_at) - new Date(r.created_at)) / 60000);
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${m % 60}m`;
}

   ---------------------------------------------------------------------------
   Almost all of this goes straight through the admin RLS policies in
   db/schema.sql — ticking permissions, deactivating people, adding and retiring
   advisors are ordinary writes that the database allows because the caller is
   the admin. Only two things need the admin Edge Function, because only two
   things need the secret key: creating a login, and writing a code hash.
=========================================================================== */

  { id: "today", label: "Today" },
  { id: "7d",    label: "7 days" },
  { id: "30d",   label: "30 days" },
  { id: "year",  label: "This year" },
  { id: "all",   label: "All time" },
];

function rangeStart(id) {
  const now = new Date();
  if (id === "today") return new Date(dayStart());        // the 3am boundary, not midnight
  if (id === "7d")    return new Date(Date.now() - 7 * 864e5);
  if (id === "30d")   return new Date(Date.now() - 30 * 864e5);
  if (id === "year")  return new Date(now.getFullYear(), 0, 1);
  return null;                                            // all time
}

async function loadAdmin() {
  // Retired staff and advisors are included: this is the screen where you bring
  // somebody back, so hiding them here would make that impossible.
  adminUsers = await api("/rest/v1/users?select=*&order=name.asc");
  adminAdvs  = await api("/rest/v1/service_advisors?select=*&order=sort_order.asc,name.asc");
}

async function loadAdminHistory() {
  const from = rangeStart(adminRange);
  let q = `/rest/v1/requests?select=${SELECT}&order=created_at.desc&limit=5000`;
  if (from) q += `&created_at=gte.${from.toISOString()}`;
  adminHistory = await api(q);
}

const median = (nums) => {
  if (!nums.length) return null;
  const s = [...nums].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};

const mins = (a, b) => (a && b) ? (new Date(b) - new Date(a)) / 60000 : null;

function humanMins(v) {
  if (v == null) return "—";
  const m = Math.round(v);
  return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`;
}

function renderAdmin() {
  const sections = [
    { id: "staff",       label: "Staff" },

  $("adminBody").querySelectorAll("[data-key]").forEach(box =>

/* Rename in place, within the row, rather than through a prompt box.
 *
 * The name is what appears on every car this person ever handles, so it is
 * worth being able to see and correct properly. Editing is contained to one
 * row; the admin tab is excluded from the poll, so nothing rebuilds underneath
 * it mid-edit. */
function startRename(u) {
  const row = document.querySelector(`[data-row="${u.id}"] .top`);
  if (!row) return;

  row.innerHTML = `
    <div class="renaming">
      <input type="text" id="renameInput" maxlength="60" value="${esc(u.name)}">
      <button class="abtn" id="renameSave">Save</button>
      <button class="abtn" id="renameCancel">Cancel</button>
    </div>`;

  const input = $("renameInput");
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);

  const cancel = () => renderAdminSection();
  $("renameCancel").onclick = cancel;

  const save = async () => {
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    if (name === u.name) return cancel();

    // Two people with the same name merge in the history filters, which is a
    // real loss of information. Allowed anyway — dealerships genuinely have two
    // Mikes — but said out loud rather than discovered later.
    const clash = adminUsers.find(x => x.id !== u.id && x.name === name);
    if (clash && !confirm(
        `Somebody else is already called "${name}".\n\n` +
        `They will be impossible to tell apart in the history filters. Continue?`)) return;

    await adminWrite(`/rest/v1/users?id=eq.${u.id}`, "PATCH", { name });
  };

  $("renameSave").onclick = save;
  input.onkeydown = (e) => {
    if (e.key === "Enter")  save();
    if (e.key === "Escape") cancel();
  };
}

/* --- Deactivated --------------------------------------------------------- */
function adminDeactivated() {
  // Advisor accounts are left out here for the same reason as on the Staff tab:
  // a retired advisor is listed just below as a retired ADVISOR, and showing
  // their account as well would be the same person twice.
  const advisorAccounts = new Set(adminAdvs.map(a => a.user_id).filter(Boolean));
  const gone     = adminUsers.filter(u => !u.active && !advisorAccounts.has(u.id));
  const retired  = adminAdvs.filter(a => !a.active);

  // Advisors are never removed, only retired — a name on last month's requests
  // is worth keeping regardless, and unlike a mistyped staff account there is
  // no such thing as an advisor created by accident.
  $("adminBody").innerHTML = `
    <p class="sub">Kept so their names stay on the cars they handled.
       Bring anyone back at any time.</p>
    <div id="codeShown"></div>

    <label>Staff</label>
    ${gone.length ? gone.map(u => `
      <div class="arow inactive">
        <div class="top">
          <div style="flex:1;min-width:0">
            <div class="nm">${esc(u.name)}</div>
            <div class="sub2">${esc(roleLabel(u))}</div>
          </div>
          <button class="abtn" data-active="${u.id}">Reactivate</button>
          ${u.is_admin ? "" : `<button class="abtn danger" data-remove="${u.id}">Remove</button>`}
        </div>
      </div>`).join("")
    : `<p class="checkhint">Nobody is deactivated.</p>`}

    <label style="margin-top:22px">Service advisors</label>
    ${retired.length ? retired.map(a => `
      <div class="arow inactive">
        <div class="top">
          <span class="keychar" style="color:${esc(a.color)}">${esc(a.key_char || "—")}</span>
          <span class="swatch" style="background:${esc(a.color)}"></span>
          <div style="flex:1;min-width:0">
            <div class="nm">${esc(a.name)}</div>
            <div class="sub2">Their character is free for someone else</div>
          </div>
          <button class="abtn" data-adv="${a.id}">Bring back</button>
        </div>
      </div>`).join("")
    : `<p class="checkhint">No advisors are retired.</p>`}`;

  $("adminBody").querySelectorAll("[data-active]").forEach(b =>
    b.onclick = async () => {
      const u = adminUsers.find(x => x.id === b.dataset.active);
      await adminWrite(`/rest/v1/users?id=eq.${u.id}`, "PATCH", { active: true });
    });

  $("adminBody").querySelectorAll("[data-adv]").forEach(b =>
    b.onclick = async () => {
      const a = adminAdvs.find(x => x.id === b.dataset.adv);
      // Somebody may have taken their key character while they were away. The
      // database trigger reassigns a fresh colour in that case; warn about the
      // character, which it cannot resolve for us.
      const taken = adminAdvs.find(x => x.active && x.key_char === a.key_char);
      if (taken && !confirm(
          `${taken.name} is using ${a.key_char} now.\n\n` +
          `Bringing ${a.name} back will leave two advisors on the same character, ` +
          `and tags starting with ${a.key_char} will match only one of them. ` +
          `Continue?`)) return;
      await adminWrite(`/rest/v1/service_advisors?id=eq.${a.id}`, "PATCH", { active: true });
      // Retiring switched their login off; bringing them back has to switch it
      // on again, or they are on the board and cannot sign in.
      if (a.user_id) {
        await adminWrite(`/rest/v1/users?id=eq.${a.user_id}`, "PATCH", { active: true });
      }
    });

  $("adminBody").querySelectorAll("[data-remove]").forEach(b =>
    b.onclick = async () => {
      const u = adminUsers.find(x => x.id === b.dataset.remove);
      if (!confirm(
          `Remove ${u.name} completely?\n\n` +
          `This deletes the account rather than deactivating it, and cannot be undone.\n\n` +
          `If they have ever issued or moved a car, the database will refuse — their ` +
          `name belongs on those records.`)) return;
      await adminCall({ action: "delete_user", user_id: u.id });
    });
}

function adminAdvisors() {
  const used = new Set(adminAdvs.filter(a => a.active).map(a => a.key_char));
  const free = [..."0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ"].filter(c => !used.has(c));

  $("adminBody").innerHTML = `
    <p class="sub">The first character of a key tag identifies the advisor.
       Colours are assigned automatically from the palette.</p>

          <span class="swatch" style="background:${esc(a.color)}"></span>

  // Advisors sign in as managers. They are senior to the desk and the lot, they

  //
  // advisor_id goes with the request so the Edge Function attaches the login in

  $("adminBody").querySelectorAll("[data-advlogin]").forEach(b =>

function adminHistoryView() {
  const done = adminHistory.filter(r => r.status === "complete");
  const waits = done.map(r => mins(r.created_at, r.claimed_at)).filter(v => v != null);
  const totals = done.map(r => mins(r.created_at, r.completed_at)).filter(v => v != null);

  const names = (fn) => [...new Set(adminHistory.map(fn).filter(Boolean))].sort();
  const sel = (id, label, key, opts) => `
    <select id="${id}" aria-label="${label}">
      <option value="">${label}</option>
      ${opts.map(o => `<option ${hFilters[key] === o ? "selected" : ""}>${esc(o)}</option>`).join("")}
    </select>`;

  // Sorted by when each request FINISHED. The fetch orders by created_at, which
  // put a car requested at 07:27 and delivered at 08:21 below everything
  // requested after 07:27 — so the cars you just delivered are the hardest ones
  // to find, which is the opposite of what this screen is for.
  const list = adminHistory
    .filter(r =>
      (!hFilters.advisor || advisorOf(r).name === hFilters.advisor) &&
      (!hFilters.cashier || r.issuer?.name === hFilters.cashier) &&
      (!hFilters.porter  || r.claimer?.name === hFilters.porter))
    .sort((a, b) => new Date(finishedAt(b)) - new Date(finishedAt(a)));

  $("adminBody").innerHTML = `
    <div class="ranges">${RANGES.map(r =>
      `<button data-range="${r.id}" aria-pressed="${r.id === adminRange}">${esc(r.label)}</button>`
    ).join("")}</div>

    <div class="stats">
      <div class="stat"><div class="v">${done.length}</div><div class="k">Delivered</div></div>
      <div class="stat"><div class="v">${humanMins(median(waits))}</div><div class="k">Median wait</div></div>
      <div class="stat"><div class="v">${humanMins(median(totals))}</div><div class="k">Median total</div></div>
    </div>

    <div class="filters">
      ${sel("aAdvisor", "All advisors", "advisor", names(r => advisorOf(r).name))}
      ${sel("aCashier", "All cashiers", "cashier", names(r => r.issuer?.name))}
      ${sel("aPorter",  "All porters",  "porter",  names(r => r.claimer?.name))}
      <button class="abtn" id="csv">Export CSV</button>
    </div>

    <p class="sub">${list.length} request${list.length === 1 ? "" : "s"}${
      rangeStart(adminRange) ? "" : " — everything on record"}.</p>
    ${list.slice(0, 300).map(r => card(r, {
        time: dayAndClock(finishedAt(r)),
        meta: r.status === "complete"
          ? `Delivered by ${r.claimer?.name || "—"} · ${humanMins(mins(r.created_at, r.completed_at))}`
          : r.status,
      })).join("")}
    ${list.length > 300 ? `<p class="sub" style="text-align:center">
       Showing the newest 300. Export the CSV for the rest.</p>` : ""}`;

  $("adminBody").querySelectorAll("[data-range]").forEach(b =>
    b.onclick = () => { adminRange = b.dataset.range; renderAdmin(); });

  const bind = (id, key) => $(id).onchange = (e) => {
    hFilters[key] = e.target.value; adminHistoryView();
  };
  bind("aAdvisor", "advisor"); bind("aCashier", "cashier"); bind("aPorter", "porter");
  $("csv").onclick = () => exportCsv(list);

  $("adminBody").querySelectorAll(".card").forEach(c =>
    c.onclick = () => openDetail(c.dataset.id));
}

function exportCsv(rows) {
  const head = ["Tag", "Advisor", "Origin", "Destination", "Via wash", "Area",
                "Status", "Issued by", "Requested", "Claimed by", "Claimed",
                "Delivered", "Wait (min)", "Total (min)", "Note"];
  // Quote everything and double any inner quotes — a note containing a comma
  // would otherwise shift every column after it.
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const body = rows.map(r => [
    r.car_code, advisorOf(r).name, LOC_LABEL[r.origin] || r.origin,
    LOC_LABEL[r.destination] || r.destination, r.via_wash ? "yes" : "",
    r.zone === "510" ? "510" : "Lower Lot", r.status,
    r.issuer?.name || "", r.created_at, r.claimer?.name || "", r.claimed_at || "",
    r.completed_at || "",
    Math.round(mins(r.created_at, r.claimed_at) ?? NaN) || "",
    Math.round(mins(r.created_at, r.completed_at) ?? NaN) || "",
    r.note || "",
  ].map(q).join(","));

  const csv = [head.map(q).join(","), ...body].join("\r\n");
  const name = `porter-dispatch-${adminRange}-${new Date().toISOString().slice(0, 10)}.csv`;
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* --- Shared admin plumbing ----------------------------------------------- */
async function adminWrite(path, method, body) {
  if (adminBusy) return;
  adminBusy = true;
  try {
    // return=representation so we can see WHICH rows changed. A PATCH that RLS
    // filters to zero rows comes back 204, indistinguishable from success — the
    // toggle would just quietly flip back on reload with no explanation. Ask
    // for the rows and check we got one.
    const rows = await api(path, {
      method, body, headers: { Prefer: "return=representation" },
    });
    if (Array.isArray(rows) && rows.length === 0) {
      throw new Error("The database refused that change. Are you still signed in as admin?");
    }
    await loadAdmin();
    renderAdminSection();
  } catch (e) {
    alert(e.message);
    renderAdmin();          // reload from the database rather than trusting the screen
  } finally { adminBusy = false; }
}

async function adminCall(payload) {
  if (adminBusy) return;
  adminBusy = true;
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + session.access_token,
        "Content-Type": "application/json",
      },
      body: JSON.stringify(payload),
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || "That did not work");

    await loadAdmin();
    renderAdminSection();

    if (d.code && $("codeShown")) {
      // Shown once, deliberately loud. It cannot be recovered afterwards.
      $("codeShown").innerHTML = `
        <div class="codebox">
          <div style="color:var(--dim);font-size:.85rem">${esc(d.name)}'s code</div>
          <div class="big">${esc(d.code)}</div>
          <div class="warnline">Write this down now — it cannot be shown again.</div>
        </div>`;
      $("codeShown").scrollIntoView({ behavior: "smooth", block: "center" });
    } else if (d.removed && $("codeShown")) {
      $("codeShown").innerHTML =
        `<div class="msg ok">${esc(d.removed)} was removed.</div>`;
    }
  } catch (e) {
    alert(e.message);
  } finally { adminBusy = false; }
}

/* ===========================================================================
   Detail sheet
=========================================================================== */
let sheetId = null;
let msgDraft = "";       // what is half-typed into the open sheet
let sheetInline = false;

/* A request's detail is shown one of two ways: as a modal sheet over a list,
   or inline as the whole My Car tab. Which one is in play must be decided
   here and nowhere else — an earlier version let `sheetInline` and the modal's
   visibility drift apart, and a stale modal sat on top showing "Mark
   delivered" for a car that had already been delivered. */
function openDetail(id, inline = false) {
  if (id !== sheetId) msgDraft = "";
  sheetId = id; sheetInline = inline;
  $("sheet").hidden = inline;      // inline mode always dismisses the modal
  renderDetail();
}

function resetSheetPosition() {
  const body = $("sheetBody");
  body.style.transition = "";
  body.style.transform = "";
  $("sheet").style.background = "";
}

function closeSheet() {
  // Belt and braces with the reset in trackKeyboard: whatever the keyboard did
  // to the document on the way in, the sheet closing puts it back.
  if (window.scrollY !== 0) window.scrollTo(0, 0);
  $("sheet").hidden = true;
  resetSheetPosition();          // or the next sheet opens already dragged down
  sheetId = null; sheetInline = false;
  render();
}

/* Drag the sheet down to dismiss it.
 *
 * Only starts when the content is already scrolled to the top, so dragging and
 * scrolling never fight each other — otherwise a porter trying to scroll a long
 * request would keep flinging the sheet shut.
 *
 * Closes on distance OR speed: a slow deliberate pull most of the way down, or
 * a quick flick that never travels far. Requiring distance alone makes a flick
 * feel broken.
 */
(function dragToDismiss() {
  const sheet = $("sheet"), body = $("sheetBody");
  let startY = 0, startedAt = 0, dragging = false, delta = 0;

  const CLOSE_DISTANCE = 110;    // px
  const CLOSE_VELOCITY = 0.45;   // px per ms

  body.addEventListener("touchstart", (e) => {
    if (body.scrollTop > 0 || e.touches.length !== 1) return;
    startY = e.touches[0].clientY;
    startedAt = Date.now();
    dragging = true; delta = 0;
    body.style.transition = "none";
  }, { passive: true });

  body.addEventListener("touchmove", (e) => {
    if (!dragging) return;
    delta = e.touches[0].clientY - startY;
    if (delta <= 0) { body.style.transform = ""; return; }   // upward: ignore
    e.preventDefault();                                       // needs passive:false
    body.style.transform = `translateY(${delta}px)`;
    sheet.style.background = `rgba(0,0,0,${(0.65 * Math.max(0, 1 - delta / 420)).toFixed(3)})`;
  }, { passive: false });

  const end = () => {
    if (!dragging) return;
    dragging = false;
    const velocity = delta / Math.max(1, Date.now() - startedAt);
    body.style.transition = "transform .2s ease-out";

    if (delta > CLOSE_DISTANCE || velocity > CLOSE_VELOCITY) {
      body.style.transform = "translateY(100%)";
      sheet.style.background = "rgba(0,0,0,0)";
      setTimeout(closeSheet, 190);
    } else {
      body.style.transform = "";        // snap back
      sheet.style.background = "";
    }
  };

  body.addEventListener("touchend", end);
  body.addEventListener("touchcancel", end);
})();

function renderDetail(message = "") {
  const r = requests.find(x => x.id === sheetId);
  if (!r) { closeSheet(); return; }

  const mine = r.claimed_by === session.user.id;
  const sameDay = r.completed_at && new Date(r.completed_at).getTime() >= dayStart();
  const actions = [];

  if (r.status === "unclaimed") {
    if (canClaim()) actions.push(["claim", "Claim this car", "primary"]);
    // Any cashier, not only the one who raised it. Mirrors cancel_request() in
    // db/schema.sql, which is the authority — this only decides what to draw.
    if (isManager() || canIssue()) {
      actions.push(["cancel", "Cancel request", "danger"]);
    }
  } else if (r.status === "claimed") {
    if (mine || isManager()) actions.push(["complete", "Mark delivered", "go"]);
    // Red, like Cancel: releasing a car puts it back on the queue and undoes
    // somebody's claim, which is the same shape of act as cancelling.
    if (mine)        actions.push(["unclaim", "Release it — I claimed this by mistake", "danger"]);
    else if (isManager()) actions.push(["unclaim", "Release it (manager)", "danger"]);
    if (isManager()) actions.push(["cancel", "Cancel request", "danger"]);
  } else if (r.status === "complete") {
    if (isManager() || (mine && sameDay)) actions.push(["reopen", "Reopen — I tapped this by mistake", ""]);
  }

  const adv = advisorOf(r);
  const color = adv.color;
  const msgs = msgsFor(r.id);
  const html = `
    ${sheetInline ? "" : `<div class="grip"></div>`}
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px">
      <span class="detail-code">${esc(r.car_code)}</span>
      <span class="status-pill ${r.status}">${esc(r.status)}</span>
    </div>
    <div class="route" style="justify-content:flex-start;margin-top:10px;font-size:1.05rem">
      ${routeHtml(r)}
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;align-items:center;--advisor:${esc(color)}">
      <span class="chip"><span class="dot"></span>${esc(adv.name)}</span>
    </div>
    ${r.note ? `<div class="msg note" style="margin-top:14px">${esc(r.note)}</div>` : ""}

    <div class="dsect">
      <div class="compose">
        <textarea id="msgBox" rows="2" maxlength="1000"
                  placeholder="Message the others about this car"></textarea>
        <button class="btn primary" id="msgSend">Send</button>
        <div id="msgErr"></div>
      </div>
      ${messageLog(msgs)}
    </div>

    <div class="dsect">
      <dl>
        <div class="kv"><dt>Issued by</dt><dd>${esc(r.issuer?.name || "—")}</dd></div>
        <div class="kv"><dt>Requested</dt><dd>${esc(dayAndClock(r.created_at))} · ${esc(ago(r.created_at))}</dd></div>
        ${r.claimed_at ? `<div class="kv"><dt>Claimed by</dt><dd>${esc(r.claimer?.name || "—")} at ${esc(clock(r.claimed_at))}</dd></div>` : ""}
        ${r.completed_at ? `<div class="kv"><dt>Delivered</dt><dd>${esc(clock(r.completed_at))} · took ${esc(minutesTaken(r))}</dd></div>` : ""}
        ${r.cancelled_at ? `<div class="kv"><dt>Cancelled</dt><dd>${esc(clock(r.cancelled_at))}</dd></div>` : ""}
      </dl>
    </div>

    <div class="dsect">
      <div id="sheetMsg">${message}</div>
      ${actions.map(([a, label, cls]) =>
         `<button class="btn ${cls}" data-act="${a}">${esc(label)}</button>`).join("")}
      ${sheetInline ? "" : `<button class="btn" data-act="close" style="margin-top:18px">Close</button>`}
    </div>`;

  if (sheetInline) $("view").innerHTML = html;
  else $("sheetBody").innerHTML = html;

  const root = sheetInline ? $("view") : $("sheetBody");
  root.querySelectorAll("[data-act]").forEach(b =>
    b.onclick = () => b.dataset.act === "close" ? closeSheet() : act(b.dataset.act, r));

  const box = root.querySelector("#msgBox");
  if (box) {
    // Survives the rebuild. The poll is held off while someone is typing, but
    // the sheet is also rebuilt after every action taken in it, and losing a
    // half-written message to tapping the wrong thing would be its own bug.
    box.value = msgDraft;
    box.oninput = () => { msgDraft = box.value; };
    root.querySelector("#msgSend").onclick = () => sendMessage(r);
  }

async function sendMessage(r) {
  const root = sheetInline ? $("view") : $("sheetBody");
  const box  = root.querySelector("#msgBox");
  const send = root.querySelector("#msgSend");
  const body = box.value.trim();
  if (!body) { box.focus(); return; }

  send.disabled = true; send.textContent = "Sending…";
  try {
    await api("/rest/v1/rpc/post_message", { method: "POST",
      body: { p_id: r.id, p_body: body } });
    msgDraft = "";                       // only once it is actually saved
    await loadRequests();
    renderDetail();
    renderTabs();
  } catch (e) {
    send.disabled = false; send.textContent = "Send";
    root.querySelector("#msgErr").innerHTML =
      `<div class="msg err">${esc(e.message)}</div>`;
  }
}

async function act(action, r) {
  // No confirmations here any more, on either claiming a second car or
  // cancelling. Carrying two cars at once is normal, and a dialog in front of
  // every one of them was asking a question whose answer was always yes.
  // Cancelling still takes opening the car first, so it is not a stray tap.
  const root = sheetInline ? $("view") : $("sheetBody");
  root.querySelectorAll("[data-act]").forEach(b => b.disabled = true);

  try {
    await api(`/rest/v1/rpc/${action}_request`, { method: "POST", body: { p_id: r.id } });
    await loadRequests();

    if (action === "complete" || action === "cancel") {
      if (sheetInline) { tab = "queue"; render(); } else closeSheet();
      return;
    }
    if (action === "claim") { tab = "queue"; closeSheet(); return; }
    if (action === "unclaim") {
      if (sheetInline) { tab = "queue"; render(); } else closeSheet();
      return;
    }
    renderDetail();
  } catch (e) {
    await loadRequests();
    // 409 is not a failure, it is the race being resolved correctly: someone
    // else got there first. Say so plainly rather than showing an error.
    const cls = e.status === 409 ? "info" : "err";
    renderDetail(`<div class="msg ${cls}">${esc(e.message)}</div>`);
    renderTabs();
  }
}

/* ===========================================================================
   Boot
=========================================================================== */
/* Is a finger or cursor down on something right now?
 *
 * This is why a button sometimes needed pressing twice.
 *
 * A click is not one event. The browser watches where the press went down and
 * where it came up, and fires click on the nearest element common to both. The
 * three-second poll rebuilds the whole view from innerHTML, which does not
 * update elements — it replaces them. So a poll landing between finger-down
 * and finger-up detaches the very button being pressed: the new one in its
 * place was never pressed, the old one is no longer in the document, there is
 * no common ancestor to speak of, and the click is simply never delivered.
 * Nothing errors. The tap just does nothing and you press again.
 *
 * The odds are roughly the length of a tap over three seconds, which is a few
 * percent — "every once in a while", exactly as reported.
 *
 * Both windows are self-expiring, deliberately. A guard that holds off the
 * poller and depends on an event arriving to release it is one missed
 * pointerup away from freezing the queue, and this app has already frozen
 * itself that way once with the history filters.
 */
let pressDownAt = 0, pressReleasedUntil = 0;
const PRESS_MAX_MS   = 2000;   // a press cannot hold the poller off longer
const PRESS_GRACE_MS = 400;    // after release, long enough for click to land

function pressInFlight() {
  const now = Date.now();
  return (pressDownAt && now - pressDownAt < PRESS_MAX_MS) || now < pressReleasedUntil;
}

/* Focused in the message box. Deliberately NOT time-bound, unlike fieldInUse:
   rebuilding the sheet destroys the textarea, which drops the keyboard, and
   somebody who swiped over to write a message and then paused to look at the
   car should not have it shut in their face. Bounded by the sheet's own
   lifetime — closing it ends this. */
function composing() {
  return document.activeElement?.id === "msgBox";
}

/* Is somebody actually using a form field right now?
   TIME-BOUND, and that is the whole point — see the note at the call site. */
function fieldInUse() {
  const busy = document.activeElement;
  return !!busy && /^(INPUT|SELECT|TEXTAREA)$/.test(busy.tagName)
         && Date.now() - lastFieldTouch < FIELD_GRACE_MS;
}

async function refresh() {
  if (session && session.loginAt < dayStart()) {
    signOut("Your session ended for the day. Sign in again.");
    return;
  }

  // Before anything else, and before any of the per-tab early returns below, so
  // it applies whichever screen is open.
  if (await checkSelf() === "gone") {
    signOut("Your account has been deactivated. Speak to John.");
    return;
  }

  await loadRequests();
  if (!session) return;

  // Somebody is mid-tap. Redrawing now would take the button out from under
  // them — see pressInFlight(). Nothing is lost by waiting: the data is already
  // fetched, and the next tick is three seconds away.
  if (pressInFlight()) return;
  // Decide from state, not from the DOM. Reading `hidden` back off the element
  // is what let the two get out of step in the first place.
  // Rebuilding the sheet under someone composing a message would clear the box
  // mid-sentence — the same trap that made the Issue form unusable. The draft
  // is also held in msgDraft, so this is the second of two defences, not the
  // only one.
  if (sheetId && !sheetInline) {
    if (!composing() && !fieldInUse()) renderDetail();
    return;
  }

  // Never rebuild the view out from under someone who is typing. The Issue tab
  // is a form with no live content to refresh, and re-rendering it every few
  // seconds wiped the car code, advisor and note mid-entry — which made
  // issuing a request outright impossible. The badges still update.
  if (tab === "issue") { renderTabs(); return; }

  // Admin is the same trap, and worse. It has forms, and it shows a newly
  // created code exactly once — a background re-render would wipe that off the
  // screen a few seconds after it appeared, and the code cannot be recovered.
  // Nothing here needs live data anyway; it reloads itself after every write.
  if (tab === "admin") { renderTabs(); return; }

  // Same reasoning anywhere else a field is in use, such as the history filters
  // or an open dropdown: leave the DOM alone rather than yanking it away.
  //
  // TIME-BOUND, and that is the whole point. Checking focus alone froze the
  // History tab permanently — a <select> keeps focus after you choose an
  // option, so one use of a filter meant every later poll skipped the render
  // and the list never changed again. A guard with no expiry is not a guard,
  // it is a latch.
  if (fieldInUse()) { renderTabs(); return; }

  // Mid-swipe. Re-rendering would replace the element the finger is holding,
  // which drops the gesture and leaves the card stuck halfway across.
  if (swipeActive) { renderTabs(); return; }

  render();
}

async function start() {
  $("login").hidden = true;
  $("app").hidden = false;
  renderWho();          // the name, straight away; the role is corrected below

  // Pull the full row before the first render: the login function returns a
  // trimmed profile, and Settings needs the notification preferences on it.
  await checkSelf();
  await loadAdvisors();
  await loadRequests();

  // Opened cold from a notification. Consumed immediately so a later reload
  // does not keep dragging them back to the queue.
  if (location.hash === "#queue") {
    tab = "queue";
    history.replaceState(null, "", location.pathname + location.search);
  }
  render();
  syncPush().then(render).catch(() => {});   // never blocks the queue appearing

  clearInterval(poller);
  poller = setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
}

$("code").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("code").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 8);
});
function openMenu() {
  $("menu").querySelector('[data-menu="admin"]').hidden = !session?.user?.is_admin;
  $("menu").hidden = false;
}
function closeMenu() { $("menu").hidden = true; }

$("menuBtn").onclick = openMenu;
// Anywhere off the panel closes it, which on a phone is the whole screen to
// the left of it.
$("menu").onclick = (e) => { if (e.target.id === "menu") closeMenu(); };
addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(); });

$("menu").querySelectorAll("[data-menu]").forEach(b =>
  b.onclick = () => {
    closeMenu();
    if (b.dataset.menu === "signout") { signOut(); return; }
    tab = b.dataset.menu;
    render();
  });
$("sheet").onclick = (e) => { if (e.target.id === "sheet") closeSheet(); };
// Stamped on real interaction, not on focus alone — focus persists long after a
// dropdown has closed, and that persistence is exactly what froze the History
// tab. Captured, so it still fires for elements inside a re-rendered view.
// Captured, so nothing can stop these reaching us, and set before any handler
// on the way down has a chance to re-render.
document.addEventListener("pointerdown", () => {
  pressDownAt = Date.now();
}, true);
["pointerup", "pointercancel"].forEach(evt =>
  document.addEventListener(evt, () => {
    pressDownAt = 0;
    pressReleasedUntil = Date.now() + PRESS_GRACE_MS;
  }, true));

["input", "keydown", "pointerdown", "change"].forEach(evt =>
  document.addEventListener(evt, (e) => {
    if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) {
      lastFieldTouch = Date.now();
    }
  }, true));

// A tapped notification, on an app that was already running. The window is
// focused rather than reloaded, so a URL would change nothing — the worker
// tells us directly instead.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("message", (e) => {
    if (e.data?.type === "show-queue") showQueue();
  });
  consumeQueueIntent();
}

/* iOS does not reliably fire visibilitychange when an installed app is resumed
   — sometimes it is pageshow, sometimes only focus. Listening for all three
   costs nothing and is the difference between the queue appearing and not. */
// Set once the worker registers, below. Held here so the foreground handler can
// ask it for an update check.
let swReg = null;

function onForeground() {
  // NOT guarded on document.hidden. That guard exists to avoid polling while
  // the app is in the background — it has no business gating the intent check.
  // iOS fires focus and pageshow while `hidden` is still true, so guarding this
  // meant the flag was never read and the queue never appeared.
  //
  // Safe to run either way: the flag carries its own one-minute expiry, and
  // switching tabs on a page nobody is looking at costs nothing.
  consumeQueueIntent();

  // The poll, however, genuinely should not run while hidden.
  if (!document.hidden && session) refresh();

  // And check for new code, on all three events for the same reason the intent
  // check is on all three: an installed iOS app resumed from the app switcher
  // does not reliably fire visibilitychange. This used to be registered on that
  // event alone, so a phone could sit on old code indefinitely — it never asked
  // whether there was anything newer.
  if (swReg) swReg.update().catch(() => {});
}
document.addEventListener("visibilitychange", onForeground);
window.addEventListener("pageshow", onForeground);
window.addEventListener("focus", onForeground);

// Version, plus when a notification tap last reached the service worker. If
// that stays blank after tapping one, the tap is not reaching the worker at all
// and nothing on the app side could have helped.
serviceWorkerVersion().then(async (v) => {
  let tapped = "";
  try {
    const hit = await (await caches.open("porter-intent")).match("/__last-click");
    if (hit) {
      const when = new Date(Number(await hit.text()));
      tapped = " · last tap " + when.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    } else {
      tapped = " · no taps seen";
    }
  } catch { /* no cache api */ }
  $("version").textContent = (v || "not installed") + tapped;
});

/* How much of the screen the keyboard is covering, as --kb.
 *
 * There is no event for "the keyboard opened". What there is is the visual
 * viewport shrinking, which is the same thing from the page's point of view:
 * whatever is left between the bottom of the visible area and the bottom of
 * the layout viewport is being covered by something, and on a phone that
 * something is the keyboard. The sheet reads this so the message box does not
 * open underneath it.
 *
 * Small values are ignored — iOS moves the visual viewport a few pixels for
 * its own reasons, and a sheet that twitched every time would be worse than
 * one that sat still. */
function trackKeyboard() {
  const vv = window.visualViewport;
  if (!vv) return;
  const read = () => {
    const covered = Math.max(0, innerHeight - vv.height - vv.offsetTop);
    const kb = covered > 60 ? covered : 0;
    document.documentElement.style.setProperty("--kb", kb + "px");

    // When the keyboard goes away, put the page back where it belongs.
    //
    // The app shell is position:fixed, so while signed in the document has
    // nothing to scroll and window.scrollY should always be 0. A keyboard
    // breaks that: iOS scrolls the document to reveal the focused field, and
    // then does not always undo it — which left the whole app shifted up with
    // its header sliced off, and no way to put it back.
    if (kb === 0 && window.scrollY !== 0 && session) window.scrollTo(0, 0);
  };
  vv.addEventListener("resize", read);
  vv.addEventListener("scroll", read);
  read();
}
trackKeyboard();

loadSession();
if (session) start().catch(() => signOut()); else $("login").hidden = false;

/* Shipping updates to a phone that has this on its Home Screen.
 *
 * An installed iOS web app that is merely backgrounded does not re-navigate
 * when you tap the icon — it restores the page it already had. So a porter can
 * be running week-old code indefinitely and have no way of knowing, and no
 * reason to force-quit. That has to be handled here rather than in a runbook
 * step nobody will follow.
 *
 * Check for a new worker on launch and every time the app comes back to the
 * foreground; when one takes over, reload once so the new code is actually
 * what the porter is looking at.
 */
if ("serviceWorker" in navigator) {
  let reloading = false;

  // updateViaCache: "none" — check sw.js against the NETWORK, never against
  // Safari's own http cache.
  //
  // GitHub Pages serves this file with max-age=600. The spec says the default
  // ("imports") already bypasses the cache for the top-level worker script, but
  // relying on that is how the app shipped stale code to phones once before —
  // the fetch handler in sw.js carries a `cache: "reload"` for the identical
  // reason. An update check that can be answered from a cache is not a check.
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(reg => {
    swReg = reg;
    reg.update();

    reg.addEventListener("updatefound", () => {
      const incoming = reg.installing;
      if (!incoming) return;

      // Read the controller HERE, not at page load. A page that loaded before
      // any worker existed would have captured "no controller" and then
      // suppressed every real update for the rest of its life. Checked at this
      // moment it means what it should: no controller = first install, so
      // there is nothing to replace and nothing to reload for.
      if (!navigator.serviceWorker.controller) return;

      incoming.addEventListener("statechange", () => {
        if (incoming.state === "activated" && !reloading) {
          reloading = true;
          location.reload();
        }
      });
    });
  }).catch(() => {});
}
</script>
</body>
</html>
