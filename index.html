<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Porter Dispatch</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Porter">
<meta name="theme-color" content="#0c0d0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<style>
/* ---------------------------------------------------------------------------
   Porter Dispatch

   Dark throughout, deliberately. The logo is white on black, porters use this
   in a dim service bay and at 7am, and a light theme would be the wrong tool
   in both. Near-black rather than pure black: the advisor colours vibrate
   against #000.

   No web fonts. The system stack loads instantly, works offline, and looks
   native on both iPhone and Android.
--------------------------------------------------------------------------- */
:root {
  --bg:        #0c0d0f;
  --surface:   #16181c;
  --surface-2: #1e2127;
  --line:      #2a2e35;
  --text:      #f2f4f6;
  --dim:       #98a0aa;
  /* Nudged up from #6b7280: against the advisor-tinted cards the timestamps
     measured 4.34:1, just under the 4.5:1 needed for normal text. Read in
     daylight, at arm's length, by someone walking. */
  --dimmer:    #7c848f;
  --silver:    #e8eaed;
  --danger:    #f0656f;
  --ok:        #4ade80;
  --warn:      #fbbf24;

  /* The five locations. 510 and 525 are the two blues on purpose: those are
     exactly the two that route a job to the 510 porters, so the colour grouping
     matches the rule. The other three all go to the lower lot. */
  --loc-510:       #7ab8f5;
  --loc-525:       #a78bfa;
  --loc-express:   #fbbf24;
  --loc-drive:     #4ade80;
  --loc-wash:      #22d3ee;
  --loc-lower_lot: #f472b6;
  --radius: 14px;
  --tap: 52px;                       /* every tappable thing clears this */
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* The `hidden` attribute is only `display:none` in the browser's own default
   stylesheet, so any author rule setting `display` silently defeats it. Both
   #login and #app are flex containers, which is exactly that trap. */
[hidden] { display: none !important; }

html, body {
  margin: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body { overscroll-behavior-y: contain; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }

/* --- Login ---------------------------------------------------------------- */
#login {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
  gap: 8px;
}
/* The logo is white artwork on a solid black plate. `screen` drops the black
   to nothing, so the mark floats on the page background instead of sitting in
   a visible dark square that never quite matches --bg. */
#login img { width: 190px; max-width: 58vw; height: auto; margin-bottom: 4px;
             mix-blend-mode: screen; }
#login h1 {
  font-size: 1rem; font-weight: 500; letter-spacing: .18em; text-transform: uppercase;
  color: var(--dim); margin: 0 0 28px;
}
#code {
  width: 100%; max-width: 320px; height: 68px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  text-align: center; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 2rem; letter-spacing: .35em; text-indent: .35em;  /* centres despite tracking */
  outline: none;
}
#code:focus { border-color: var(--silver); }
#login button {
  width: 100%; max-width: 320px; height: 56px; margin-top: 14px;
  background: var(--silver); color: #000; font-weight: 650;
  border-radius: var(--radius); font-size: 1.05rem;
}
#login button:disabled { opacity: .45; }
#loginErr { color: var(--danger); min-height: 1.4em; margin: 14px 0 0; text-align: center; font-size: .92rem; }

/* --- Shell ---------------------------------------------------------------- */
#app { min-height: 100%; display: flex; flex-direction: column; }

header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background: rgba(12,13,15,.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
header .who { flex: 1; min-width: 0; }
header .who b { display: block; font-size: .95rem; font-weight: 600; }
header .who span { display: block; font-size: .74rem; color: var(--dimmer); letter-spacing: .06em; text-transform: uppercase; }
header button {
  height: 38px; padding: 0 13px; border-radius: 9px;
  background: var(--surface-2); color: var(--dim); font-size: .85rem;
}

main { flex: 1; padding: 16px 16px 24px; }

nav {
  position: sticky; bottom: 0; z-index: 20;
  display: flex; gap: 2px;
  padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
  background: rgba(12,13,15,.94); backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
}
nav button {
  flex: 1; min-height: var(--tap); border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--dimmer); letter-spacing: 0;
  /* A manager sees five tabs. Without nowrap, "In Progress" breaks onto two
     lines and every other label sits higher than it. */
  font-size: .63rem; white-space: nowrap; padding: 0 2px;
}
nav button .ico { font-size: 1.15rem; line-height: 1; }
nav button[aria-current="true"] { color: var(--text); background: var(--surface-2); }
nav .badge {
  position: absolute; transform: translate(20px, -14px);
  background: var(--silver); color: #000; font-size: .62rem; font-weight: 700;
  min-width: 17px; height: 17px; border-radius: 9px; padding: 0 5px;
  display: grid; place-items: center;
}

h2.title { font-size: 1.35rem; font-weight: 650; margin: 2px 0 14px; letter-spacing: -.01em; }
.sub { color: var(--dimmer); font-size: .85rem; margin: -8px 0 16px; }

/* --- Request cards -------------------------------------------------------- */
.card {
  position: relative;
  border: 1px solid var(--line);
  border-left: 5px solid var(--advisor, var(--line));
  border-radius: var(--radius);
  padding: 14px 15px; margin-bottom: 11px;
  display: block; width: 100%; text-align: left;

  /* The whole card carries a wash of the advisor's colour as well as the solid
     strip, so a glance down the queue groups by advisor without reading. Kept
     low — much past this and the body text starts losing contrast against it,
     and the colours stop being distinguishable from each other anyway.
     The first declaration is the fallback for anything without color-mix. */
  background: var(--surface);
  background: color-mix(in srgb, var(--advisor, var(--surface)) 13%, var(--surface));
}
.card:active {
  background: var(--surface-2);
  background: color-mix(in srgb, var(--advisor, var(--surface-2)) 22%, var(--surface-2));
}
/* The card is three bands: small metadata top, the car code and its route in
   the middle, small metadata bottom. The middle band is what a porter reads at
   a glance from a moving start, so it gets the space and the weight. */
.card { display: flex; flex-direction: column; min-height: 148px; padding: 12px 14px; }
.card .row1 { display: flex; align-items: center; gap: 10px; }
.card .age { margin-left: auto; color: var(--dimmer); font-size: .78rem; white-space: nowrap; }

.card .mid {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 5px;
  /* Sits the block slightly above true centre, so the route underneath reads as
     hanging off the code rather than the pair floating in the middle. */
  padding-bottom: 10px;
}
.code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 2.1rem; font-weight: 700; letter-spacing: .07em; line-height: 1.1;
  /* Monospace on purpose: this is the one string a porter reads off a screen
     and matches against a windscreen. O vs 0 and I vs 1 have to be obvious. */
}

/* --- Route ---------------------------------------------------------------- */
.route {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; flex-wrap: wrap; font-size: .9rem; font-weight: 600;
}
.route .arrow { color: var(--dimmer); font-weight: 400; }
.loc { white-space: nowrap; }

/* Locations are coloured to make the routing rule legible without explaining
   it: 510 and 525 — the two that send a job to the 510 porters — are the two
   blues. Everything else, which goes to the lower lot, is a different family.
   The grouping is doing real work here, not decoration. */
.loc-510       { color: var(--loc-510); }
.loc-525       { color: var(--loc-525); }
.loc-express   { color: var(--loc-express); }
.loc-drive     { color: var(--loc-drive); }
.loc-wash      { color: var(--loc-wash); }
.loc-lower_lot { color: var(--loc-lower_lot); }

.card .row3 {
  display: flex; align-items: center; gap: 8px;
  font-size: .76rem; color: var(--dimmer); min-height: 16px;
}
.card .row3 .porter { margin-left: auto; color: var(--dim); white-space: nowrap; }
.card .row3 .cardnote {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}

/* The advisor's colour NEVER travels alone — the name rides with it every
   time. Roughly 1 in 12 men cannot reliably separate some of these hues, and
   a queue keyed only on colour is unusable for them. */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .78rem; color: var(--dim);
}
.chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--advisor); flex: none; }
.note { margin-top: 9px; color: var(--dim); font-size: .88rem; }
.meta { margin-top: 8px; color: var(--dimmer); font-size: .76rem; }

.empty { text-align: center; color: var(--dimmer); padding: 56px 20px; }
.empty .big { font-size: 2.4rem; margin-bottom: 10px; opacity: .35; }

/* --- Forms and buttons ---------------------------------------------------- */
label { display: block; font-size: .78rem; color: var(--dim); margin: 16px 0 7px;
        letter-spacing: .07em; text-transform: uppercase; }
input[type=text], select, textarea {
  width: 100%; min-height: var(--tap); padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
  outline: none; appearance: none;
}
input[type=text]:focus, select:focus, textarea:focus { border-color: var(--silver); }
/* appearance:none strips the native dropdown arrow, leaving a select that looks
   like a plain text field. Put one back, or nobody knows it opens. */
select {
  background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%),
                    linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position: calc(100% - 19px) calc(50% + 2px), calc(100% - 13px) calc(50% + 2px);
  background-size: 6px 6px; background-repeat: no-repeat;
  padding-right: 40px;
}
textarea { min-height: 84px; resize: vertical; }
#car_code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 1.3rem; letter-spacing: .09em; text-transform: uppercase; }

/* Location pickers. Two columns rather than six across: at 375px, six buttons
   would be 57px each, well under a comfortable tap target and too narrow for
   "Lower Lot". Two columns keeps 510/525 paired and Express/Drive paired, which
   is also how they group in practice, and six entries fill three rows exactly. */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button {
  min-height: var(--tap); border-radius: 11px;
  background: var(--surface); border: 1px solid var(--line); color: var(--dim);
  font-weight: 650; letter-spacing: .03em;
}
.seg button[aria-pressed="true"] { background: var(--silver); color: #000; border-color: var(--silver); }

/* Sub-tabs for the two porter areas. */
.zonebar { display: flex; gap: 6px; margin: 0 0 14px; }
.zonebar button {
  flex: 1; min-height: 42px; border-radius: 10px; font-size: .88rem; font-weight: 600;
  background: var(--surface); border: 1px solid var(--line); color: var(--dimmer);
}
.zonebar button[aria-current="true"] {
  background: var(--surface-2); color: var(--text); border-color: #3a4049;
}
.zonebar .n { font-size: .78rem; color: var(--dimmer); margin-left: 5px; }
.zonebar button[aria-current="true"] .n { color: var(--dim); }

.checkrow {
  display: flex; align-items: center; gap: 12px; margin-top: 18px;
  min-height: var(--tap); padding: 10px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
}
.checkrow input { width: 22px; height: 22px; accent-color: var(--loc-wash); flex: none; }
.checkrow label { margin: 0; text-transform: none; letter-spacing: 0;
                  font-size: .95rem; color: var(--text); }
.checkrow.disabled { opacity: .45; }
.checkhint { color: var(--dimmer); font-size: .78rem; margin: 7px 2px 0; }

.btn {
  display: block; width: 100%; min-height: 56px; border-radius: 12px;
  font-size: 1.02rem; font-weight: 650; margin-top: 10px;
  background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
}
.btn.primary { background: var(--silver); color: #000; border-color: var(--silver); }
.btn.danger  { color: var(--danger); }
.btn:disabled { opacity: .45; }

.msg { margin-top: 14px; padding: 12px 14px; border-radius: 11px; font-size: .9rem; }
.msg.err  { background: #2a1416; color: var(--danger); }
.msg.info { background: #1a2029; color: var(--dim); }
.msg.ok   { background: #10231a; color: var(--ok); }

.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.filters select { min-height: 44px; font-size: .88rem; padding: 8px 11px; }

/* --- Detail sheet --------------------------------------------------------- */
#sheet {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(0,0,0,.65); backdrop-filter: blur(3px);
  display: flex; align-items: flex-end;
}
#sheet[hidden] { display: none; }
#sheetBody {
  width: 100%; max-height: 92vh; overflow-y: auto;
  background: var(--bg); border-top: 1px solid var(--line);
  border-radius: 20px 20px 0 0;
  padding: 8px 18px calc(24px + env(safe-area-inset-bottom));
  animation: rise .22s ease-out;
  /* Stops iOS rubber-banding the page behind the sheet while dragging it. */
  overscroll-behavior: contain;
}
@keyframes rise { from { transform: translateY(16px); opacity: .4 } }

/* The grip is a promise that the sheet can be dragged down. It has to be one
   the app keeps — see the touch handlers below. A control that looks draggable
   and isn't is worse than no control. */
.grip {
  width: 38px; height: 5px; border-radius: 3px; background: var(--line);
  margin: 6px auto 16px; cursor: grab;
}
/* Widen the target well past the visible bar: a thumb reaching the top of a
   sheet one-handed is not precise, and 5px is nothing. */
.grip::before { content: ""; position: absolute; left: 0; right: 0;
                margin-top: -14px; height: 34px; }
.detail-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: 2.3rem; font-weight: 650; letter-spacing: .05em; }
.kv { display: flex; justify-content: space-between; gap: 16px;
      padding: 11px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
.kv dt { color: var(--dimmer); flex: none; }
.kv dd { margin: 0; text-align: right; }
dl { margin: 16px 0 22px; }

.status-pill {
  display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; padding: 4px 10px; border-radius: 6px; margin-left: 10px;
  vertical-align: middle;
}
.status-pill.unclaimed { background: #262a31; color: var(--dim); }
.status-pill.claimed   { background: #1f2c22; color: var(--ok); }
.status-pill.complete  { background: #1a2029; color: var(--dimmer); }
.status-pill.cancelled { background: #2a1416; color: var(--danger); }

/* --- Admin ---------------------------------------------------------------- */
.arow {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
}
.arow.inactive { opacity: .5; }
.arow .top { display: flex; align-items: center; gap: 10px; }
.arow .nm { font-weight: 600; flex: 1; min-width: 0; }
.arow .sub2 { color: var(--dimmer); font-size: .76rem; margin-top: 2px; }

/* Permission toggles. Big enough to hit with a thumb, and labelled — an
   unlabelled grid of switches is how somebody gets the wrong one. */
.perms { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 11px; }
.perm {
  display: flex; align-items: center; gap: 9px; min-height: 44px;
  padding: 6px 11px; border-radius: 9px; font-size: .84rem;
  background: var(--bg); border: 1px solid var(--line); color: var(--dim);
}
.perm input { width: 19px; height: 19px; accent-color: var(--silver); flex: none; }
.perm.on { color: var(--text); border-color: #3a4049; }

.abtn {
  min-height: 40px; padding: 0 13px; border-radius: 9px; font-size: .84rem;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--dim);
}
.abtn.warn { color: var(--warn); }
.abtn.danger { color: var(--danger); }

.swatch { width: 22px; height: 22px; border-radius: 6px; flex: none; }
.keychar {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 1.15rem; font-weight: 700; width: 30px; text-align: center; flex: none;
}

/* A code is shown exactly once and then never again. It needs to look like
   something to write down, not like a status message. */
.codebox {
  margin-top: 14px; padding: 16px; border-radius: 12px; text-align: center;
  background: #10231a; border: 1px solid #1f4d36;
}
.codebox .big {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 2.2rem; font-weight: 700; letter-spacing: .18em; color: var(--ok);
}
.codebox .warnline { color: var(--warn); font-size: .8rem; margin-top: 8px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.stat {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 11px; padding: 11px 9px; text-align: center;
}
.stat .v { font-size: 1.25rem; font-weight: 650; }
.stat .k { font-size: .68rem; color: var(--dimmer); text-transform: uppercase;
           letter-spacing: .06em; margin-top: 3px; }

.ranges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.ranges button {
  min-height: 38px; padding: 0 12px; border-radius: 9px; font-size: .82rem;
  background: var(--surface); border: 1px solid var(--line); color: var(--dimmer);
}
.ranges button[aria-pressed="true"] {
  background: var(--surface-2); color: var(--text); border-color: #3a4049;
}

.offline {
  position: fixed; left: 12px; right: 12px; z-index: 80;
  bottom: calc(78px + env(safe-area-inset-bottom));
  background: #3a2a12; color: var(--warn); border: 1px solid #5a4420;
  border-radius: 11px; padding: 10px 14px; font-size: .86rem; text-align: center;
}
.offline[hidden] { display: none; }
</style>
</head>
<body>

<!-- ========================= LOGIN ========================= -->
<div id="login">
  <img src="logo.png" alt="Autobahn Motors">
  <h1>Porter Dispatch</h1>
  <input id="code" type="text" inputmode="numeric" autocomplete="off"
         maxlength="8" placeholder="········" aria-label="Your 8-digit code">
  <button id="loginBtn">Sign in</button>
  <p id="loginErr" role="alert"></p>
</div>

<!-- ========================= APP ========================= -->
<div id="app" hidden>
  <header>
    <div class="who"><b id="whoName"></b><span id="whoRole"></span></div>
    <button id="adminBtn" hidden>Admin</button>
    <button id="signOutBtn">Sign out</button>
  </header>
  <main id="view"></main>
  <nav id="tabs"></nav>
</div>

<div class="offline" id="offline" hidden>No connection — showing the last known queue</div>

<div id="sheet" hidden><div id="sheetBody"></div></div>

<script>
/* ===========================================================================
   Configuration

   Both values are public by design and are meant to be here. The publishable
   key is what the app authenticates with before anyone logs in; it grants
   nothing on its own. Every table refuses it — see SECURITY-TESTS.md.

   The key that must never appear in this file, or anywhere in this repo, is
   the secret one. It bypasses every rule in db/schema.sql.
=========================================================================== */
const SUPABASE_URL = "https://txnijhgfitfklyjativk.supabase.co";
const SUPABASE_KEY = "sb_publishable_rJEFL4ZmSL_fWJ2v33rVUg_Ovwcmosw";

const POLL_MS = 3000;          // how often the queue refreshes while on screen

/* How long after touching a form field the app leaves the DOM alone. Long
   enough to type a tag or scroll an open dropdown; short enough that a field
   left focused never stops the screen updating. */
const FIELD_GRACE_MS = 8000;
const DAY_BOUNDARY_HOUR = 3;   // sessions end at 3am, matching app_day_start() in SQL
const STORE = "porter.session.v1";

/* --- State ------------------------------------------------------------- */
let session = null;      // { access_token, refresh_token, expires_at, user, loginAt }
let advisors = [];
let requests = [];
let tab = "queue";
let zone = "510";        // which area sub-tab is showing in Queue / In Progress
let poller = null;
let lastFetchOk = true;
let lastFieldTouch = 0;        // when a form field was last actually interacted with

/* --- Small helpers ------------------------------------------------------ */
const $ = (id) => document.getElementById(id);

// Everything user-typed goes through this before it touches innerHTML. Car
// codes and notes are free text from a phone; treating them as markup would be
// a stored-XSS hole affecting everyone who opens the queue.
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const isManager = () => !!session?.user && session.user.is_manager;
const canIssue  = () => !!session?.user && (session.user.can_issue || session.user.is_manager);
const canClaim  = () => canClaimZone("510") || canClaimZone("lower_lot");

// Mirrors app_can_claim_zone() in db/schema.sql. That one is the authority —
// this only decides what to draw. Every claim is re-checked by the database.
function canClaimZone(zone) {
  const u = session?.user;
  if (!u) return false;
  if (u.is_manager) return true;
  return zone === "510" ? !!u.can_claim_510 : !!u.can_claim_lower;
}

/* The five locations, in the order cashiers use them. The first four are the
   common ones; wash is the tail. */
/* Order is John's, by how often each is actually used — not alphabetical and
   not grouped by area. The picker renders in this order, so changing it here
   changes it everywhere. */
const LOCATIONS = [
  { id: "510",       label: "510" },
  { id: "lower_lot", label: "Lower Lot" },
  { id: "drive",     label: "Drive" },
  { id: "express",   label: "Express" },
  { id: "525",       label: "525" },
  { id: "wash",      label: "Wash" },
];
const LOC_LABEL = Object.fromEntries(LOCATIONS.map(l => [l.id, l.label]));

const ZONES = [
  { id: "510",       label: "510" },
  { id: "lower_lot", label: "Lower Lot" },
];

// Which area sub-tabs this person gets. Porters see only where they work;
// cashiers and managers see both, because they need the whole picture.
function visibleZones() {
  const u = session?.user;
  if (!u) return [];
  if (u.is_manager || u.can_issue || u.is_admin) return ZONES;
  const mine = ZONES.filter(z => canClaimZone(z.id));
  return mine.length ? mine : ZONES;   // view-only staff still see both
}

/* Who a key tag belongs to, for display.
 *
 * Mirrors advisor_for_code() in db/schema.sql, but only for the Issue form's
 * live feedback — what actually gets stored is decided by the database when the
 * request is created. Three distinct outcomes that all look like "no advisor"
 * if you are not careful:
 *
 *   Tow-In   the tag starts with T; the car was towed in
 *   N/A      a three-character tag; no advisor was assigned
 *   Unknown  four characters, first matches nobody — a bad tag, or an advisor
 *            who has not been added yet. Shown in red because it is the one
 *            worth looking at.
 */
const TAG_TOW  = { name: "Tow-In",  color: "#cbd5e1" };
const TAG_NONE = { name: "N/A",     color: "#64748b" };
const TAG_BAD  = { name: "Unknown", color: "#ef4444" };

function advisorForCode(code) {
  const c = String(code || "").trim().toUpperCase();
  if (c.length <= 3) return TAG_NONE;
  if (c[0] === "T")  return TAG_TOW;
  return advisors.find(a => a.key_char === c[0]) || TAG_BAD;
}

// For a stored request, prefer what the database recorded — history is a record
// of who it WAS, and must not shift if a key character is reassigned later.
function advisorOf(r) {
  if (r.advisor) return r.advisor;
  if (r.tag_type === "tow_in") return TAG_TOW;
  if (r.tag_type === "none")   return TAG_NONE;
  return TAG_BAD;
}

/* Renders "510 → Wash → Express".
 *
 * The wash stop is a WAYPOINT, not a destination — that is the whole reason
 * via_wash exists separately. Guarded anyway: the database refuses to set it
 * when an end of the journey is already the wash, so "Wash → Wash" cannot
 * arrive here, but rendering should not depend on that holding. */
function routeHtml(r) {
  const steps = [r.origin, ...(r.via_wash && r.origin !== "wash" && r.destination !== "wash"
                               ? ["wash"] : []), r.destination];
  return steps
    .map(s => `<span class="loc loc-${esc(s)}">${esc(LOC_LABEL[s] || s)}</span>`)
    .join('<span class="arrow">→</span>');
}

function roleLabel(u) {
  const parts = [];
  if (u.is_admin) parts.push("Admin");
  if (u.is_manager) parts.push("Manager");
  if (!u.is_manager) {
    if (u.can_issue) parts.push("Cashier");
    // Name the area, since it decides what they can pick up. A porter seeing a
    // short queue should be able to tell at a glance whether that is because
    // work is slow or because they are looking at the wrong half of the site.
    if (u.can_claim_510 && u.can_claim_lower) parts.push("Porter · 510 + Lower Lot");
    else if (u.can_claim_510)   parts.push("510 Porter");
    else if (u.can_claim_lower) parts.push("Lower Lot Porter");
  }
  return parts.join(" · ") || "No permissions";
}

function ago(iso) {
  const mins = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const h = Math.floor(mins / 60);
  return h < 24 ? `${h}h ${mins % 60}m ago` : `${Math.floor(h / 24)}d ago`;
}

function clock(iso) {
  return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

function dayAndClock(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + clock(iso);
}

/* The instant the current "day" began — the most recent 3am. Mirrors
   app_day_start() in db/schema.sql, which is the authority; this copy only
   decides when to end a session, never what the database will allow. */
function dayStart() {
  const d = new Date();
  d.setHours(DAY_BOUNDARY_HOUR, 0, 0, 0);
  if (Date.now() < d.getTime()) d.setDate(d.getDate() - 1);
  return d.getTime();
}

/* ===========================================================================
   Network
=========================================================================== */
async function api(path, { method = "GET", body, headers = {}, retry = true } = {}) {
  const res = await fetch(SUPABASE_URL + path, {
    method,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + (session?.access_token || SUPABASE_KEY),
      "Content-Type": "application/json",
      ...headers,
    },
    body: body === undefined ? undefined : JSON.stringify(body),
  });

  // An expired access token looks exactly like a permission failure from here,
  // so try one silent refresh before concluding the user must sign in again.
  if (res.status === 401 && retry && session?.refresh_token) {
    if (await refreshSession()) return api(path, { method, body, headers, retry: false });
  }

  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    const err = new Error(data?.message || data?.error || `Request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}

async function refreshSession() {
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token }),
    });
    if (!res.ok) return false;
    const d = await res.json();
    session.access_token = d.access_token;
    session.refresh_token = d.refresh_token;
    session.expires_at = d.expires_at;
    saveSession();
    return true;
  } catch { return false; }
}

const saveSession = () => localStorage.setItem(STORE, JSON.stringify(session));

function loadSession() {
  try { session = JSON.parse(localStorage.getItem(STORE) || "null"); } catch { session = null; }
  // One login per day: anything from before the last 3am is over.
  if (session && (!session.loginAt || session.loginAt < dayStart())) session = null;
}

function signOut() {
  session = null;
  localStorage.removeItem(STORE);
  clearInterval(poller); poller = null;
  requests = []; advisors = []; tab = "queue";
  $("app").hidden = true;
  $("login").hidden = false;
  $("code").value = "";
  $("loginErr").textContent = "";
}

/* ===========================================================================
   Login
=========================================================================== */
async function doLogin() {
  const code = $("code").value.trim();
  const err = $("loginErr");
  err.textContent = "";

  if (!/^\d{8}$/.test(code)) { err.textContent = "Enter your 8-digit code."; return; }

  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "Signing in…";
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/login`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ code }),
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || "Could not sign in");

    session = { ...d, loginAt: Date.now() };
    saveSession();
    await start();
  } catch (e) {
    err.textContent = e.message;
    $("code").value = "";
    $("code").focus();
  } finally {
    $("loginBtn").disabled = false;
    $("loginBtn").textContent = "Sign in";
  }
}

/* ===========================================================================
   Data
=========================================================================== */
const SELECT =
  "*,advisor:service_advisors(id,name,color,key_char)," +
  "issuer:users!requests_issued_by_fkey(name)," +
  "claimer:users!requests_claimed_by_fkey(name)";

async function loadAdvisors() {
  advisors = await api("/rest/v1/service_advisors?select=id,name,color,key_char" +
                       "&active=is.true&order=sort_order.asc,name.asc");
}

async function loadRequests() {
  // The live queue is everything unfinished, plus enough recent history to fill
  // the History tab without a second round trip. Older history is fetched only
  // when that tab asks for it.
  const since = new Date(Date.now() - 7 * 864e5).toISOString();
  try {
    // DESC with the limit, then sorted back. Ordering ascending and taking 500
    // keeps the OLDEST 500 — so the moment this dealership passes 500 requests
    // in a week, the newest ones silently stop arriving and the queue quietly
    // goes stale. Ordering descending keeps the newest, which is what a limit
    // is for.
    const rows = await api(`/rest/v1/requests?select=${SELECT}` +
      `&or=(status.in.(unclaimed,claimed),created_at.gte.${since})` +
      `&order=created_at.desc&limit=500`);
    // The queue renders in array order and must be oldest first.
    requests = rows.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    lastFetchOk = true;
  } catch (e) {
    if (e.status === 401) { signOut(); return; }
    lastFetchOk = false;         // keep showing the last good queue
  }
  $("offline").hidden = lastFetchOk;
}

const byStatus = (s) => requests.filter(r => r.status === s);
const myClaims = () => requests.filter(r => r.status === "claimed" && r.claimed_by === session.user.id);

/* ===========================================================================
   Rendering
=========================================================================== */
function tabsFor() {
  const t = [{ id: "queue", label: "Queue", ico: "☰" }];
  if (canClaim()) t.push({ id: "mycar", label: "My Car", ico: "★" });
  t.push({ id: "progress", label: "In Progress", ico: "◷" });
  if (canIssue()) t.push({ id: "issue", label: "Issue", ico: "＋" });
  t.push({ id: "history", label: "History", ico: "⟲" });
  return t;
}

function renderTabs() {
  const list = tabsFor();
  // "admin" is reached from the header, not the tab bar, so it is legitimately
  // absent from this list — don't bounce back to the queue when it is showing.
  if (tab !== "admin" && !list.some(t => t.id === tab)) tab = list[0].id;

  // The queue badge counts every area this person can see, not just the sub-tab
  // they happen to be looking at — otherwise a cashier on the 510 tab would see
  // "3" while five cars waited.
  const mineZones = visibleZones().map(z => z.id);
  const waiting = byStatus("unclaimed").filter(r => mineZones.includes(r.zone)).length;

  $("tabs").innerHTML = list.map(t => {
    let badge = "";
    if (t.id === "queue" && waiting)
      badge = `<span class="badge">${waiting}</span>`;
    if (t.id === "mycar" && myClaims().length)
      badge = `<span class="badge">${myClaims().length}</span>`;
    return `<button data-tab="${t.id}" aria-current="${t.id === tab}">
              <span class="ico">${t.ico}</span>${esc(t.label)}${badge}
            </button>`;
  }).join("");

  $("tabs").querySelectorAll("button").forEach(b =>
    b.onclick = () => { tab = b.dataset.tab; render(); });
}

function card(r, opts = {}) {
  const adv = advisorOf(r);
  const color = adv.color;
  const porter = r.claimer?.name ? `<span class="porter">${esc(r.claimer.name)}</span>` : "";
  const bottom = r.note
    ? `<span class="cardnote">${esc(r.note)}</span>`
    : (opts.meta ? `<span class="cardnote">${esc(opts.meta)}</span>` : "");

  return `
    <button class="card" data-id="${r.id}" style="--advisor:${esc(color)}">
      <div class="row1">
        <span class="chip"><span class="dot"></span>${esc(adv.name)}</span>
        <span class="age">${esc(opts.time || ago(r.created_at))}</span>
      </div>
      <div class="mid">
        <div class="code">${esc(r.car_code)}</div>
        <div class="route">${routeHtml(r)}</div>
      </div>
      <div class="row3">${bottom}${porter}</div>
    </button>`;
}

/* The area sub-tabs above the Queue and In Progress lists.
   Drawn only when there is a choice to make — a porter who works one area gets
   no switcher, because there is nothing to switch to. */
function zoneBar(counts) {
  const zones = visibleZones();
  if (zones.length < 2) return "";
  if (!zones.some(z => z.id === zone)) zone = zones[0].id;
  return `<div class="zonebar">` + zones.map(z =>
    `<button data-zone="${z.id}" aria-current="${z.id === zone}">${esc(z.label)}` +
    (counts[z.id] ? `<span class="n">${counts[z.id]}</span>` : "") +
    `</button>`).join("") + `</div>`;
}

// Requests in the area currently being viewed. A porter with one area sees
// theirs; anyone with both sees whichever sub-tab is selected.
function inZone(list) {
  const zones = visibleZones();
  const active = zones.some(z => z.id === zone) ? zone : zones[0]?.id;
  return list.filter(r => r.zone === active);
}

function bindZoneBar() {
  $("view").querySelectorAll("[data-zone]").forEach(b =>
    b.onclick = () => { zone = b.dataset.zone; render(); });
}

function empty(icon, title, sub = "") {
  return `<div class="empty"><div class="big">${icon}</div><div>${esc(title)}</div>
          ${sub ? `<div style="font-size:.85rem;margin-top:6px">${esc(sub)}</div>` : ""}</div>`;
}

function render() {
  renderTabs();
  const v = $("view");

  if (tab === "queue") {
    // Strictly oldest first. No location or route jumps the queue — the top
    // card is always the longest wait.
    const all = byStatus("unclaimed");
    const counts = Object.fromEntries(ZONES.map(z => [z.id, all.filter(r => r.zone === z.id).length]));
    const open = inZone(all);
    v.innerHTML = `<h2 class="title">Unclaimed</h2>` + zoneBar(counts) +
      (open.length
        ? `<p class="sub">Oldest first. ${open.length} waiting.</p>` + open.map(r => card(r)).join("")
        : empty("✓", "Nothing waiting", "Every car in this area has been picked up."));
    bindZoneBar();
  }

  else if (tab === "mycar") {
    const mine = myClaims();
    if (mine.length === 1) { v.innerHTML = ""; return openDetail(mine[0].id, true); }
    v.innerHTML = `<h2 class="title">My Cars</h2>` +
      (mine.length
        ? `<p class="sub">You have ${mine.length} active. Tap one to finish it.</p>` +
          mine.map(r => card(r, { time: "claimed " + ago(r.claimed_at) })).join("")
        : empty("★", "No car claimed", "Take one from the Unclaimed tab."));
  }

  else if (tab === "progress") {
    const all = byStatus("claimed");
    const counts = Object.fromEntries(ZONES.map(z => [z.id, all.filter(r => r.zone === z.id).length]));
    const live = inZone(all);
    v.innerHTML = `<h2 class="title">In Progress</h2>` + zoneBar(counts) +
      (live.length
        ? `<p class="sub">${live.length} being delivered right now.</p>` +
          live.map(r => card(r, { time: "claimed " + ago(r.claimed_at) })).join("")
        : empty("◷", "Nothing in progress in this area"));
    bindZoneBar();
  }

  else if (tab === "issue") renderIssue();
  else if (tab === "history") renderHistory();
  else if (tab === "admin")   renderAdmin();

  v.querySelectorAll(".card").forEach(c => c.onclick = () => openDetail(c.dataset.id));
}

/* --- Issue --------------------------------------------------------------- */
let issueOrigin = null;
let issueDest   = null;
let issueWash   = false;

// Mirrors the generated `zone` column in db/schema.sql. Shown to the cashier so
// they can see who the request is about to go to before they send it — the
// routing is otherwise invisible, and a cashier who picks the wrong location
// would have no way of noticing.
const zoneFor = (o, d) =>
  (["510", "525"].includes(o) || ["510", "525"].includes(d)) ? "510" : "lower_lot";

function locButtons(kind, selected) {
  return LOCATIONS.map(l =>
    `<button data-${kind}="${l.id}" aria-pressed="${l.id === selected}">` +
    `${esc(l.label)}</button>`).join("");
}

function renderIssue() {
  // A wash stop is meaningless if the wash is already an end of the journey.
  const washNA = issueOrigin === "wash" || issueDest === "wash";

  $("view").innerHTML = `
    <h2 class="title">Issue a Request</h2>

    <label for="car_code">Key tag</label>
    <input id="car_code" type="text" autocomplete="off" autocapitalize="characters"
           spellcheck="false" maxlength="20">
    <div id="tagWho"></div>

    <label>Pick up from</label>
    <div class="seg" id="segOrigin">${locButtons("origin", issueOrigin)}</div>

    <label>Take to</label>
    <div class="seg" id="segDest">${locButtons("dest", issueDest)}</div>

    <div class="checkrow ${washNA ? "disabled" : ""}">
      <input type="checkbox" id="viaWash" ${issueWash && !washNA ? "checked" : ""}
             ${washNA ? "disabled" : ""}>
      <label for="viaWash">Stop at the wash on the way</label>
    </div>
    ${washNA ? `<p class="checkhint">The wash is already one end of this trip.</p>` : ""}

    <div id="routePreview"></div>

    <label for="note">Note <span style="text-transform:none;letter-spacing:0">(optional)</span></label>
    <textarea id="note" maxlength="500" placeholder="Customer name, bay number…"></textarea>

    <button class="btn primary" id="submitReq">Send to porters</button>
    <div id="issueMsg"></div>`;

  // Everything below updates the form IN PLACE. Re-rendering on each tap would
  // blank the car code, advisor and note the cashier has already typed, and
  // picking locations after typing the code is the natural order.
  const paint = () => {
    $("segOrigin").querySelectorAll("[data-origin]").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.origin === issueOrigin)));
    $("segDest").querySelectorAll("[data-dest]").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.dest === issueDest)));

    const na = issueOrigin === "wash" || issueDest === "wash";
    const box = $("viaWash");
    box.disabled = na;
    if (na) { issueWash = false; box.checked = false; }
    box.closest(".checkrow").classList.toggle("disabled", na);

    if (issueOrigin && issueDest) {
      const z = zoneFor(issueOrigin, issueDest);
      $("routePreview").innerHTML =
        `<div class="msg info" style="text-align:center">
           <div class="route" style="font-size:1rem">
             ${routeHtml({ origin: issueOrigin, destination: issueDest, via_wash: issueWash })}
           </div>
           <div style="font-size:.78rem;margin-top:7px;color:var(--dimmer)">
             Goes to ${z === "510" ? "510" : "Lower Lot"} porters
           </div>
         </div>`;
    } else {
      $("routePreview").innerHTML = "";
    }

    // Who the tag belongs to, shown as it is typed. The cashier never picks an
    // advisor now, so this is their only chance to notice a mistyped tag before
    // the car is on its way to the wrong person's customer.
    // Nothing until three characters. One or two is a tag mid-typing, and
    // flashing "N/A" at it before settling on a name is noise. Three is a real
    // answer — that IS a tag with no advisor — so it shows from there.
    const code = $("car_code").value.trim();
    if (code.length < 3) { $("tagWho").innerHTML = ""; return; }
    const a = advisorForCode(code);
    const bad = a === TAG_BAD;
    $("tagWho").innerHTML =
      `<div class="chip" style="--advisor:${esc(a.color)};margin-top:9px;font-size:.9rem">
         <span class="dot"></span>
         <span style="color:${bad ? "var(--danger)" : "var(--dim)"}">${esc(a.name)}</span>
       </div>` +
      (bad ? `<p class="checkhint" style="color:var(--danger)">
                No advisor uses "${esc(code[0].toUpperCase())}". Check the tag.
              </p>` : "");
  };

  $("segOrigin").querySelectorAll("[data-origin]").forEach(b =>
    b.onclick = () => { issueOrigin = b.dataset.origin; paint(); });
  $("segDest").querySelectorAll("[data-dest]").forEach(b =>
    b.onclick = () => { issueDest = b.dataset.dest; paint(); });
  $("viaWash").onchange = (e) => { issueWash = e.target.checked; paint(); };
  $("car_code").addEventListener("input", paint);
  $("submitReq").onclick = submitRequest;

  paint();
}

async function submitRequest() {
  const code = $("car_code").value.trim();
  const note = $("note").value.trim();
  const msg = $("issueMsg");
  msg.innerHTML = "";

  const fail = (t) => { msg.innerHTML = `<div class="msg err">${esc(t)}</div>`; };
  if (!code)        return fail("Enter the key tag.");
  if (!issueOrigin) return fail("Choose where the car is now.");
  if (!issueDest)   return fail("Choose where it needs to go.");

  // An unrecognised first character is warned about, not blocked. A cashier
  // holding a real tag should never be stuck because the advisor list is stale;
  // the request still needs to reach a porter.
  const btn = $("submitReq");
  btn.disabled = true; btn.textContent = "Sending…";
  try {
    await api("/rest/v1/rpc/create_request", { method: "POST", body: {
      p_car_code: code,
      p_origin: issueOrigin,
      p_destination: issueDest,
      p_via_wash: issueWash,
      p_note: note || null,
    }});
    const sentTo = zoneFor(issueOrigin, issueDest) === "510" ? "510" : "Lower Lot";
    await loadRequests();
    issueOrigin = null; issueDest = null; issueWash = false;
    renderIssue();
    $("issueMsg").innerHTML =
      `<div class="msg ok">${esc(code.toUpperCase())} sent to the ${sentTo} porters.</div>`;
  } catch (e) {
    msg.innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = "Send to porters";
  }
}

/* --- History ------------------------------------------------------------- */
let hFilters = { advisor: "", cashier: "", porter: "", order: "desc" };

function renderHistory() {
  const done = requests.filter(r => r.status === "complete" || r.status === "cancelled");

  const names = (key) => [...new Map(done
    .filter(r => r[key]?.name).map(r => [r[key].name, r[key].name])).values()].sort();

  let list = done.filter(r =>
    (!hFilters.advisor || advisorOf(r).name === hFilters.advisor) &&
    (!hFilters.cashier || r.issuer?.name === hFilters.cashier) &&
    (!hFilters.porter  || r.claimer?.name === hFilters.porter));

  list.sort((a, b) => hFilters.order === "desc"
    ? new Date(b.created_at) - new Date(a.created_at)
    : new Date(a.created_at) - new Date(b.created_at));

  const sel = (id, label, key, opts) => `
    <select id="${id}" aria-label="${label}">
      <option value="">${label}</option>
      ${opts.map(o => `<option ${hFilters[key] === o ? "selected" : ""}>${esc(o)}</option>`).join("")}
    </select>`;

  $("view").innerHTML = `
    <h2 class="title">History</h2>
    <p class="sub">Finished requests from the last 7 days.</p>
    <div class="filters">
      ${sel("fAdvisor", "All advisors", "advisor", names("advisor"))}
      ${sel("fCashier", "All cashiers", "cashier", names("issuer"))}
      ${sel("fPorter",  "All porters",  "porter",  names("claimer"))}
      <select id="fOrder" aria-label="Sort order">
        <option value="desc" ${hFilters.order === "desc" ? "selected" : ""}>Newest first</option>
        <option value="asc"  ${hFilters.order === "asc"  ? "selected" : ""}>Oldest first</option>
      </select>
    </div>` +
    (list.length
      ? list.map(r => card(r, {
          time: dayAndClock(r.created_at),
          meta: r.status === "cancelled"
            ? "Cancelled"
            : `Delivered by ${r.claimer?.name || "—"} · ${minutesTaken(r)}`,
        })).join("")
      : empty("⟲", "Nothing matches", "Try clearing the filters."));

  const bind = (id, key) => $(id).onchange = (e) => {
    hFilters[key] = e.target.value; renderHistory();
  };
  bind("fAdvisor", "advisor"); bind("fCashier", "cashier");
  bind("fPorter", "porter");   bind("fOrder", "order");

  $("view").querySelectorAll(".card").forEach(c => c.onclick = () => openDetail(c.dataset.id));
}

function minutesTaken(r) {
  if (!r.completed_at) return "—";
  const m = Math.round((new Date(r.completed_at) - new Date(r.created_at)) / 60000);
  return m < 60 ? `${m} min` : `${Math.floor(m / 60)}h ${m % 60}m`;
}

/* ===========================================================================
   Admin
   ---------------------------------------------------------------------------
   Almost all of this goes straight through the admin RLS policies in
   db/schema.sql — ticking permissions, deactivating people, adding and retiring
   advisors are ordinary writes that the database allows because the caller is
   the admin. Only two things need the admin Edge Function, because only two
   things need the secret key: creating a login, and writing a code hash.
=========================================================================== */
let adminSection = "staff";     // staff | advisors | history
let adminUsers   = [];
let adminAdvs    = [];          // includes retired ones
let adminHistory = [];
let adminRange   = "30d";
let adminBusy    = false;

const RANGES = [
  { id: "today", label: "Today" },
  { id: "7d",    label: "7 days" },
  { id: "30d",   label: "30 days" },
  { id: "year",  label: "This year" },
  { id: "all",   label: "All time" },
];

function rangeStart(id) {
  const now = new Date();
  if (id === "today") return new Date(dayStart());        // the 3am boundary, not midnight
  if (id === "7d")    return new Date(Date.now() - 7 * 864e5);
  if (id === "30d")   return new Date(Date.now() - 30 * 864e5);
  if (id === "year")  return new Date(now.getFullYear(), 0, 1);
  return null;                                            // all time
}

async function loadAdmin() {
  // Retired staff and advisors are included: this is the screen where you bring
  // somebody back, so hiding them here would make that impossible.
  adminUsers = await api("/rest/v1/users?select=*&order=name.asc");
  adminAdvs  = await api("/rest/v1/service_advisors?select=*&order=sort_order.asc,name.asc");
}

async function loadAdminHistory() {
  const from = rangeStart(adminRange);
  let q = `/rest/v1/requests?select=${SELECT}&order=created_at.desc&limit=5000`;
  if (from) q += `&created_at=gte.${from.toISOString()}`;
  adminHistory = await api(q);
}

const median = (nums) => {
  if (!nums.length) return null;
  const s = [...nums].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
};

const mins = (a, b) => (a && b) ? (new Date(b) - new Date(a)) / 60000 : null;

function humanMins(v) {
  if (v == null) return "—";
  const m = Math.round(v);
  return m < 60 ? `${m}m` : `${Math.floor(m / 60)}h ${m % 60}m`;
}

function renderAdmin() {
  const sections = [
    { id: "staff",       label: "Staff" },
    { id: "deactivated", label: "Inactive" },
    { id: "advisors",    label: "Advisors" },
    { id: "history",     label: "History" },
  ];
  $("view").innerHTML = `
    <h2 class="title">Admin</h2>
    <div class="zonebar">${sections.map(s =>
      `<button data-sec="${s.id}" aria-current="${s.id === adminSection}">${esc(s.label)}</button>`
    ).join("")}</div>
    <div id="adminBody"><p class="sub">Loading…</p></div>`;

  $("view").querySelectorAll("[data-sec]").forEach(b =>
    b.onclick = () => { adminSection = b.dataset.sec; renderAdmin(); });

  (async () => {
    try {
      if (adminSection === "history") await loadAdminHistory();
      else await loadAdmin();
    } catch (e) {
      $("adminBody").innerHTML = `<div class="msg err">${esc(e.message)}</div>`;
      return;
    }
    renderAdminSection();
  })();
}

function renderAdminSection() {
  if (adminSection === "staff")            adminStaff();
  else if (adminSection === "deactivated") adminDeactivated();
  else if (adminSection === "advisors")    adminAdvisors();
  else                                     adminHistoryView();
}

        </div>

  $("adminBody").querySelectorAll("[data-key]").forEach(box =>

  $("adminBody").querySelectorAll("[data-active]").forEach(b =>
    b.onclick = async () => {
      const u = adminUsers.find(x => x.id === b.dataset.active);
      await adminWrite(`/rest/v1/users?id=eq.${u.id}`, "PATCH", { active: true });
    });

  $("adminBody").querySelectorAll("[data-adv]").forEach(b =>
    b.onclick = async () => {
      const a = adminAdvs.find(x => x.id === b.dataset.adv);
      // Somebody may have taken their key character while they were away. The
      // database trigger reassigns a fresh colour in that case; warn about the
      // character, which it cannot resolve for us.
      const taken = adminAdvs.find(x => x.active && x.key_char === a.key_char);
      if (taken && !confirm(
          `${taken.name} is using ${a.key_char} now.\n\n` +
          `Bringing ${a.name} back will leave two advisors on the same character, ` +
          `and tags starting with ${a.key_char} will match only one of them. ` +

      if (!confirm(

          `This deletes the account rather than deactivating it, and cannot be undone.\n\n` +
          `If they have ever issued or moved a car, the database will refuse — their ` +
          `name belongs on those records.`)) return;
      await adminCall({ action: "delete_user", user_id: u.id });
    });
}

      <div class="stat"><div class="v">${humanMins(median(waits))}</div><div class="k">Median wait</div></div>
      <div class="stat"><div class="v">${humanMins(median(totals))}</div><div class="k">Median total</div></div>
    </div>

    <div class="filters">
      ${sel("aAdvisor", "All advisors", "advisor", names(r => advisorOf(r).name))}
      ${sel("aCashier", "All cashiers", "cashier", names(r => r.issuer?.name))}
      ${sel("aPorter",  "All porters",  "porter",  names(r => r.claimer?.name))}
      <button class="abtn" id="csv">Export CSV</button>
    </div>

    <p class="sub">${list.length} request${list.length === 1 ? "" : "s"}${
      rangeStart(adminRange) ? "" : " — everything on record"}.</p>
    ${list.slice(0, 300).map(r => card(r, {
        time: dayAndClock(r.created_at),
        meta: r.status === "complete"
          ? `Delivered by ${r.claimer?.name || "—"} · ${humanMins(mins(r.created_at, r.completed_at))}`
          : r.status,
      })).join("")}
    ${list.length > 300 ? `<p class="sub" style="text-align:center">
       Showing the newest 300. Export the CSV for the rest.</p>` : ""}`;

  $("adminBody").querySelectorAll("[data-range]").forEach(b =>

  const bind = (id, key) => $(id).onchange = (e) => {
    hFilters[key] = e.target.value; adminHistoryView();
  };
  bind("aAdvisor", "advisor"); bind("aCashier", "cashier"); bind("aPorter", "porter");
  $("csv").onclick = () => exportCsv(list);

  $("adminBody").querySelectorAll(".card").forEach(c =>
    c.onclick = () => openDetail(c.dataset.id));
}

function exportCsv(rows) {
  const head = ["Tag", "Advisor", "Origin", "Destination", "Via wash", "Area",
                "Status", "Issued by", "Requested", "Claimed by", "Claimed",
                "Delivered", "Wait (min)", "Total (min)", "Note"];
  // Quote everything and double any inner quotes — a note containing a comma
  // would otherwise shift every column after it.
  const q = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const body = rows.map(r => [
    r.car_code, advisorOf(r).name, LOC_LABEL[r.origin] || r.origin,
    LOC_LABEL[r.destination] || r.destination, r.via_wash ? "yes" : "",
    r.zone === "510" ? "510" : "Lower Lot", r.status,
    r.issuer?.name || "", r.created_at, r.claimer?.name || "", r.claimed_at || "",
    r.completed_at || "",
    Math.round(mins(r.created_at, r.claimed_at) ?? NaN) || "",
    Math.round(mins(r.created_at, r.completed_at) ?? NaN) || "",
    r.note || "",
  ].map(q).join(","));

  const csv = [head.map(q).join(","), ...body].join("\r\n");
  const name = `porter-dispatch-${adminRange}-${new Date().toISOString().slice(0, 10)}.csv`;
  const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

/* --- Shared admin plumbing ----------------------------------------------- */
async function adminWrite(path, method, body) {
  if (adminBusy) return;
  adminBusy = true;
  try {
    // return=representation so we can see WHICH rows changed. A PATCH that RLS
    // filters to zero rows comes back 204, indistinguishable from success — the
    // toggle would just quietly flip back on reload with no explanation. Ask
    // for the rows and check we got one.
    const rows = await api(path, {
      method, body, headers: { Prefer: "return=representation" },
    });
    if (Array.isArray(rows) && rows.length === 0) {
      throw new Error("The database refused that change. Are you still signed in as admin?");
    }
    await loadAdmin();
    renderAdminSection();
  } catch (e) {
    alert(e.message);
    renderAdmin();          // reload from the database rather than trusting the screen
  } finally { adminBusy = false; }
}

async function adminCall(payload) {
  if (adminBusy) return;
  adminBusy = true;
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin`, {
      method: "POST",
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: "Bearer " + session.access_token,
        "Content-Type": "application/json",
      },
      body: JSON.stringify(payload),
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || "That did not work");

    await loadAdmin();
    renderAdminSection();

    if (d.code && $("codeShown")) {
      // Shown once, deliberately loud. It cannot be recovered afterwards.
      $("codeShown").innerHTML = `
        <div class="codebox">
          <div style="color:var(--dim);font-size:.85rem">${esc(d.name)}'s code</div>
          <div class="big">${esc(d.code)}</div>
          <div class="warnline">Write this down now — it cannot be shown again.</div>
        </div>`;
      $("codeShown").scrollIntoView({ behavior: "smooth", block: "center" });
    } else if (d.removed && $("codeShown")) {
      $("codeShown").innerHTML =
        `<div class="msg ok">${esc(d.removed)} was removed.</div>`;
    }
  } catch (e) {
    alert(e.message);
  } finally { adminBusy = false; }
}

/* ===========================================================================
   Detail sheet
=========================================================================== */
let sheetId = null;
let sheetInline = false;

/* A request's detail is shown one of two ways: as a modal sheet over a list,
   or inline as the whole My Car tab. Which one is in play must be decided
   here and nowhere else — an earlier version let `sheetInline` and the modal's
   visibility drift apart, and a stale modal sat on top showing "Mark
   delivered" for a car that had already been delivered. */
function openDetail(id, inline = false) {
  sheetId = id; sheetInline = inline;
  $("sheet").hidden = inline;      // inline mode always dismisses the modal
  renderDetail();
}

function resetSheetPosition() {
  const body = $("sheetBody");
  body.style.transition = "";
  body.style.transform = "";
  $("sheet").style.background = "";
}

function closeSheet() {
  $("sheet").hidden = true;
  resetSheetPosition();          // or the next sheet opens already dragged down
  sheetId = null; sheetInline = false;
  render();
}

/* Drag the sheet down to dismiss it.
 *
 * Only starts when the content is already scrolled to the top, so dragging and
 * scrolling never fight each other — otherwise a porter trying to scroll a long
 * request would keep flinging the sheet shut.
 *
 * Closes on distance OR speed: a slow deliberate pull most of the way down, or
 * a quick flick that never travels far. Requiring distance alone makes a flick
 * feel broken.
 */
(function dragToDismiss() {
  const sheet = $("sheet"), body = $("sheetBody");
  let startY = 0, startedAt = 0, dragging = false, delta = 0;

  const CLOSE_DISTANCE = 110;    // px
  const CLOSE_VELOCITY = 0.45;   // px per ms

  body.addEventListener("touchstart", (e) => {
    if (body.scrollTop > 0 || e.touches.length !== 1) return;
    startY = e.touches[0].clientY;
    startedAt = Date.now();
    dragging = true; delta = 0;
    body.style.transition = "none";
  }, { passive: true });

  body.addEventListener("touchmove", (e) => {
    if (!dragging) return;
    delta = e.touches[0].clientY - startY;
    if (delta <= 0) { body.style.transform = ""; return; }   // upward: ignore
    e.preventDefault();                                       // needs passive:false
    body.style.transform = `translateY(${delta}px)`;
    sheet.style.background = `rgba(0,0,0,${(0.65 * Math.max(0, 1 - delta / 420)).toFixed(3)})`;
  }, { passive: false });

  const end = () => {
    if (!dragging) return;
    dragging = false;
    const velocity = delta / Math.max(1, Date.now() - startedAt);
    body.style.transition = "transform .2s ease-out";

    if (delta > CLOSE_DISTANCE || velocity > CLOSE_VELOCITY) {
      body.style.transform = "translateY(100%)";
      sheet.style.background = "rgba(0,0,0,0)";
      setTimeout(closeSheet, 190);
    } else {
      body.style.transform = "";        // snap back
      sheet.style.background = "";
    }
  };

  body.addEventListener("touchend", end);
  body.addEventListener("touchcancel", end);
})();

function renderDetail(message = "") {
  const r = requests.find(x => x.id === sheetId);
  if (!r) { closeSheet(); return; }

  const mine = r.claimed_by === session.user.id;
  const sameDay = r.completed_at && new Date(r.completed_at).getTime() >= dayStart();
  const actions = [];

  if (r.status === "unclaimed") {
    if (canClaim()) actions.push(["claim", "Claim this car", "primary"]);
    if (isManager() || (canIssue() && r.issued_by === session.user.id)) {
      actions.push(["cancel", "Cancel request", "danger"]);
    }
  } else if (r.status === "claimed") {
    if (mine || isManager()) actions.push(["complete", "Mark delivered", "primary"]);
    if (mine)        actions.push(["unclaim", "Release it — I claimed this by mistake", ""]);
    else if (isManager()) actions.push(["unclaim", "Release it (manager)", ""]);
    if (isManager()) actions.push(["cancel", "Cancel request", "danger"]);
  } else if (r.status === "complete") {
    if (isManager() || (mine && sameDay)) actions.push(["reopen", "Reopen — I tapped this by mistake", ""]);
  }

  const adv = advisorOf(r);
  const color = adv.color;
  const html = `
    ${sheetInline ? "" : `<div class="grip"></div>`}
    <div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px">
      <span class="detail-code">${esc(r.car_code)}</span>
      <span class="status-pill ${r.status}">${esc(r.status)}</span>
    </div>
    <div class="route" style="justify-content:flex-start;margin-top:10px;font-size:1.05rem">
      ${routeHtml(r)}
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;align-items:center;--advisor:${esc(color)}">
      <span class="chip"><span class="dot"></span>${esc(adv.name)}</span>
    </div>
    ${r.note ? `<div class="msg info" style="margin-top:14px">${esc(r.note)}</div>` : ""}
    <dl>
      <div class="kv"><dt>Area</dt><dd>${r.zone === "510" ? "510" : "Lower Lot"}</dd></div>
      <div class="kv"><dt>Issued by</dt><dd>${esc(r.issuer?.name || "—")}</dd></div>
      <div class="kv"><dt>Requested</dt><dd>${esc(dayAndClock(r.created_at))} · ${esc(ago(r.created_at))}</dd></div>
      ${r.claimed_at ? `<div class="kv"><dt>Claimed by</dt><dd>${esc(r.claimer?.name || "—")} at ${esc(clock(r.claimed_at))}</dd></div>` : ""}
      ${r.completed_at ? `<div class="kv"><dt>Delivered</dt><dd>${esc(clock(r.completed_at))} · took ${esc(minutesTaken(r))}</dd></div>` : ""}
      ${r.cancelled_at ? `<div class="kv"><dt>Cancelled</dt><dd>${esc(clock(r.cancelled_at))}</dd></div>` : ""}
    </dl>
    <div id="sheetMsg">${message}</div>
    ${actions.map(([a, label, cls]) =>
       `<button class="btn ${cls}" data-act="${a}">${esc(label)}</button>`).join("")}
    ${sheetInline ? "" : `<button class="btn" data-act="close" style="margin-top:18px">Close</button>`}`;

  if (sheetInline) $("view").innerHTML = html;
  else $("sheetBody").innerHTML = html;

  const root = sheetInline ? $("view") : $("sheetBody");
  root.querySelectorAll("[data-act]").forEach(b =>
    b.onclick = () => b.dataset.act === "close" ? closeSheet() : act(b.dataset.act, r));
}

async function act(action, r) {
  // The one confirmation in the app. A porter who already has a car and taps
  // Claim again is usually mis-tapping, but sometimes genuinely doubling up —
  // so ask rather than forbid.
  if (action === "claim") {
    const held = myClaims();
    if (held.length && !confirm(
        `You already have ${held.map(x => x.car_code).join(", ")} claimed.\n\n` +
        `Claim ${r.car_code} as well?`)) return;
  }
  if (action === "cancel" && !confirm(`Cancel the request for ${r.car_code}?`)) return;

  const root = sheetInline ? $("view") : $("sheetBody");
  root.querySelectorAll("[data-act]").forEach(b => b.disabled = true);

  try {
    await api(`/rest/v1/rpc/${action}_request`, { method: "POST", body: { p_id: r.id } });
    await loadRequests();

    if (action === "complete" || action === "cancel") {
      if (sheetInline) { tab = "queue"; render(); } else closeSheet();
      return;
    }
    if (action === "claim") { tab = "mycar"; closeSheet(); return; }
    if (action === "unclaim") {
      if (sheetInline) { tab = "queue"; render(); } else closeSheet();
      return;
    }
    renderDetail();
  } catch (e) {
    await loadRequests();
    // 409 is not a failure, it is the race being resolved correctly: someone
    // else got there first. Say so plainly rather than showing an error.
    const cls = e.status === 409 ? "info" : "err";
    renderDetail(`<div class="msg ${cls}">${esc(e.message)}</div>`);
    renderTabs();
  }
}

/* ===========================================================================
   Boot
=========================================================================== */
async function refresh() {
  if (session && session.loginAt < dayStart()) { signOut(); return; }
  await loadRequests();
  if (!session) return;
  // Decide from state, not from the DOM. Reading `hidden` back off the element
  // is what let the two get out of step in the first place.
  if (sheetId && !sheetInline) { renderDetail(); return; }

  // Never rebuild the view out from under someone who is typing. The Issue tab
  // is a form with no live content to refresh, and re-rendering it every few
  // seconds wiped the car code, advisor and note mid-entry — which made
  // issuing a request outright impossible. The badges still update.
  if (tab === "issue") { renderTabs(); return; }

  // Admin is the same trap, and worse. It has forms, and it shows a newly
  // created code exactly once — a background re-render would wipe that off the
  // screen a few seconds after it appeared, and the code cannot be recovered.
  // Nothing here needs live data anyway; it reloads itself after every write.
  if (tab === "admin") { renderTabs(); return; }

  // Same reasoning anywhere else a field is in use, such as the history filters
  // or an open dropdown: leave the DOM alone rather than yanking it away.
  //
  // TIME-BOUND, and that is the whole point. Checking focus alone froze the
  // History tab permanently — a <select> keeps focus after you choose an
  // option, so one use of a filter meant every later poll skipped the render
  // and the list never changed again. A guard with no expiry is not a guard,
  // it is a latch.
  const busy = document.activeElement;
  const inUse = busy && /^(INPUT|SELECT|TEXTAREA)$/.test(busy.tagName)
                && Date.now() - lastFieldTouch < FIELD_GRACE_MS;
  if (inUse) { renderTabs(); return; }

  render();
}

async function start() {
  $("login").hidden = true;
  $("app").hidden = false;
  $("whoName").textContent = session.user.name;
  $("whoRole").textContent = roleLabel(session.user);
  $("adminBtn").hidden = !session.user.is_admin;

  await loadAdvisors();
  await loadRequests();
  render();

  clearInterval(poller);
  poller = setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
}

$("loginBtn").onclick = doLogin;
$("code").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("code").addEventListener("input", e => {
  e.target.value = e.target.value.replace(/\D/g, "").slice(0, 8);
});
$("signOutBtn").onclick = signOut;
$("adminBtn").onclick = () => { tab = "admin"; render(); };
$("sheet").onclick = (e) => { if (e.target.id === "sheet") closeSheet(); };
// Stamped on real interaction, not on focus alone — focus persists long after a
// dropdown has closed, and that persistence is exactly what froze the History
// tab. Captured, so it still fires for elements inside a re-rendered view.
["input", "keydown", "pointerdown", "change"].forEach(evt =>
  document.addEventListener(evt, (e) => {
    if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) {
      lastFieldTouch = Date.now();
    }
  }, true));

document.addEventListener("visibilitychange", () => { if (!document.hidden && session) refresh(); });

loadSession();
if (session) start().catch(signOut); else $("login").hidden = false;

/* Shipping updates to a phone that has this on its Home Screen.
 *
 * An installed iOS web app that is merely backgrounded does not re-navigate
 * when you tap the icon — it restores the page it already had. So a porter can
 * be running week-old code indefinitely and have no way of knowing, and no
 * reason to force-quit. That has to be handled here rather than in a runbook
 * step nobody will follow.
 *
 * Check for a new worker on launch and every time the app comes back to the
 * foreground; when one takes over, reload once so the new code is actually
 * what the porter is looking at.
 */
if ("serviceWorker" in navigator) {
  let reloading = false;

  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.update();
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) reg.update();
    });

    reg.addEventListener("updatefound", () => {
      const incoming = reg.installing;
      if (!incoming) return;

      // Read the controller HERE, not at page load. A page that loaded before
      // any worker existed would have captured "no controller" and then
      // suppressed every real update for the rest of its life. Checked at this
      // moment it means what it should: no controller = first install, so
      // there is nothing to replace and nothing to reload for.
      if (!navigator.serviceWorker.controller) return;

      incoming.addEventListener("statechange", () => {
        if (incoming.state === "activated" && !reloading) {
          reloading = true;
          location.reload();
        }
      });
    });
  }).catch(() => {});
}
</script>
