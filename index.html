<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Porter Dispatch</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- "black", not "black-translucent". Translucent asks iOS to draw the app
     under the status bar, and iOS then reports a viewport 59px shorter than the
     screen while still laying out from the top — leaving a strip at the bottom
     the page cannot reach. Plain black puts the app below the status bar, where
     the viewport it is given matches the space it actually has. The bar is
     black either way; this app has no artwork up there to show off.
     iOS reads this when the app is added to the Home Screen, so an app already
     installed keeps the old behaviour until it is removed and re-added — which
     is why the CSS above handles both cases. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Porter">
<meta name="theme-color" content="#0c0d0f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<style>
/* ---------------------------------------------------------------------------
   Porter Dispatch

   Dark throughout, deliberately. The logo is white on black, porters use this
   in a dim service bay and at 7am, and a light theme would be the wrong tool
   in both. Near-black rather than pure black: the advisor colours vibrate
   against #000.

   No web fonts. The system stack loads instantly, works offline, and looks
   native on both iPhone and Android.
--------------------------------------------------------------------------- */
:root {
  --bg:        #0c0d0f;
  --surface:   #16181c;
  --surface-2: #1e2127;
  --line:      #2a2e35;
  --text:      #f2f4f6;
  --dim:       #98a0aa;
  /* Nudged up from #6b7280: against the advisor-tinted cards the timestamps
     measured 4.34:1, just under the 4.5:1 needed for normal text. Read in
     daylight, at arm's length, by someone walking. */
  --dimmer:    #7c848f;
  --silver:    #e8eaed;
  --danger:    #f0656f;
  --ok:        #4ade80;
  --warn:      #fbbf24;

  /* The five locations. 510 and 525 are the two blues on purpose: those are
     exactly the two that route a job to the 510 porters, so the colour grouping
     matches the rule. The other three all go to the lower lot. */
  --loc-510:       #7ab8f5;
  --loc-525:       #a78bfa;
  --loc-express:   #fbbf24;
  --loc-drive:     #4ade80;
  --loc-wash:      #22d3ee;
  --loc-lower_lot: #f472b6;
  /* The bar's fill, named because the porter bar's bump has to match it
     exactly — the two are meant to read as one continuous surface.
     Opaque, and that matters: at 94% the bump and the bar drifted apart over
     scrolling content, because the bar blurs its backdrop and the bump cannot.
     6% of a dark page is not worth a seam down the middle of the tab bar. */
  --navbg:     #0c0d0f;

  /* The bottom safe area, capped.
     A phone will report far more than its real inset under some conditions — a
     keyboard being one — and everything anchored to the bottom of the screen
     grows when it does. An earlier version froze the largest value ever seen,
     which turned one such spike into a permanent 85px of dead space under the
     tab bar; a ceiling is the same protection without the memory.
     48px, not 34: 34 is the iPhone home indicator, but Android's three-button
     navigation bar is 48dp and capping at 34 would tuck the tab bar under it.
     Anything above 48 is not a system inset, it is a keyboard. */
  --safe-bottom: min(env(safe-area-inset-bottom, 0px), 48px);

  /* The tally inside a filter button. Blue, because grey recedes exactly where
     this number matters — and TWO tints of the one hue, because the button it
     sits in is dark when unselected and near-white when selected.
     No single colour can do both: against #16181c and #e8eaed the best any one
     colour can reach is 3.84:1, which is under the 4.5 needed for text this
     small. Split in two and it is 8.5:1 and 5.5:1. Same hue, 210deg, so it
     still reads as one colour changing background rather than two colours. */
  --count-on-dark:  #7ab8f5;
  --count-on-light: #095cae;

  --radius: 14px;
  --tap: 52px;                       /* every tappable thing clears this */
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* The `hidden` attribute is only `display:none` in the browser's own default
   stylesheet, so any author rule setting `display` silently defeats it. Both
   #login and #app are flex containers, which is exactly that trap. */
[hidden] { display: none !important; }

html, body {
  margin: 0; height: 100%;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body { overscroll-behavior-y: contain; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }

/* --- The menu ---------------------------------------------------------------
   Slides in from the right over everything, including the tab bar. */
#menuBtn {
  width: 44px; padding: 0; font-size: 1.3rem; line-height: 1;
  /* U+2630 has no colour form to fall into, unlike the gear it replaces, but
     ask for the text glyph anyway — it costs nothing and the tab bar learned
     this lesson the hard way. */
  font-variant-emoji: text;
}

#menu { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.55); }
#menu[hidden] { display: none; }
.menupanel {
  position: absolute; top: 0; right: 0; height: 100%;
  width: min(300px, 78vw);
  background: var(--surface); border-left: 1px solid var(--line);
  padding: calc(env(safe-area-inset-top) + 18px) 14px calc(18px + var(--safe-bottom));
  display: flex; flex-direction: column; gap: 8px;
  animation: slidein .18s ease-out;
}
@keyframes slidein { from { transform: translateX(100%); } }

.menupanel button {
  display: block; width: 100%; text-align: left;
  min-height: 54px; padding: 0 16px; border-radius: 11px;
  background: var(--surface-2); border: 1px solid var(--line);
  color: var(--text); font-size: 1rem; font-weight: 600;
}
.menupanel button.danger { color: var(--danger); }
.menupanel button[hidden] { display: none; }

/* --- Login ---------------------------------------------------------------- */
#login {
  min-height: 100%;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px 24px calc(32px + var(--safe-bottom));
  gap: 8px;
}
/* The logo is white artwork on a solid black plate. `screen` drops the black
   to nothing, so the mark floats on the page background instead of sitting in
   a visible dark square that never quite matches --bg. */
#login img { width: 190px; max-width: 58vw; height: auto; margin-bottom: 4px;
             mix-blend-mode: screen; }
#login h1 {
  font-size: 1rem; font-weight: 500; letter-spacing: .18em; text-transform: uppercase;
  color: var(--dim); margin: 0 0 28px;
}
#code {
  width: 100%; max-width: 320px; height: 68px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  text-align: center; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 2rem; letter-spacing: .35em; text-indent: .35em;  /* centres despite tracking */
  outline: none;
}
#code:focus { border-color: var(--silver); }
#login button {
  width: 100%; max-width: 320px; height: 56px; margin-top: 14px;
  background: var(--silver); color: #000; font-weight: 650;
  border-radius: var(--radius); font-size: 1.05rem;
}
#login button:disabled { opacity: .45; }
#loginErr { color: var(--danger); min-height: 1.4em; margin: 14px 0 0; text-align: center; font-size: .92rem; }
#version { color: var(--dimmer); font-size: .68rem; margin: 20px 0 0; letter-spacing: .08em; }

/* --- Shell ---------------------------------------------------------------- */
/* An app shell locked to the viewport, rather than a document that happens to
   be about a screen tall.
 *
 * Two goes at this failed while the tab bar was part of a scrolling document.
 * Sticky tied it to the document's height; fixed took it off the document but
 * left it exposed to iOS moving fixed elements about — and on a standalone
 * Home Screen app, a page that cannot scroll still rubber-bands when you drag
 * it, which drags a fixed bar with it. Both failures only showed on the tabs
 * whose content does not fill the screen, which is what the report described.
 *
 * inset:0 makes this box the viewport, exactly, always. main scrolls inside
 * it; the bar is simply the last row of it and cannot go anywhere. There is no
 * document scroll left to be wrong about. */
/* inset:0 — the layout viewport, and no further.
 *
 * 100vh was tried here and is wrong. On a standalone iOS app with a
 * translucent status bar, 100vh does report the full screen (932 on a 430x932
 * phone) while the layout viewport reports 873 — but the web view does not
 * PAINT below 873. Sizing the shell to 932 did not reclaim the strip, it just
 * pushed the bottom of the tab bar off the screen and sliced the labels in
 * half. The strip is unreachable, not merely unclaimed.
 *
 * The only real fix for it is the status bar meta in the head, which iOS reads
 * when an app is added to the Home Screen — so an app installed before that
 * change keeps the short viewport until it is removed and re-added. */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; }

header {
  flex: none; position: relative; z-index: 20;
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
  background: rgba(12,13,15,.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}
header .who { flex: 1; min-width: 0; }
header .who b { display: block; font-size: .95rem; font-weight: 600; }
header .who span { display: block; font-size: .74rem; color: var(--dimmer); letter-spacing: .06em; text-transform: uppercase; }
header button {
  height: 38px; padding: 0 13px; border-radius: 9px;
  background: var(--surface-2); color: var(--dim); font-size: .85rem;
}

/* The scroller. Not the document — this element. The bar sits below it as a
   sibling, so nothing here can push the bar around however long a tab gets.
   The bottom padding clears the half-circle, which overhangs this box. */
main {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior-y: contain;
  -webkit-overflow-scrolling: touch;
  padding: 16px 16px 58px;
}

/* The last row of the shell. Not sticky, not fixed — neither survived contact
   with a standalone iOS app. It is positioned only so the half-circle, which
   overhangs main, paints above it. */
nav {
  position: relative; flex: none; z-index: 20;
  display: flex; gap: 2px;
  padding: 6px 6px calc(6px + var(--safe-bottom));
  background: var(--navbg);
  border-top: 1px solid var(--line);
}
nav button {
  flex: 1; min-height: var(--tap); border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--dimmer); letter-spacing: 0;
  /* A manager sees five tabs. Without nowrap, "In Progress" breaks onto two
     lines and every other label sits higher than it. */
  font-size: .63rem; white-space: nowrap; padding: 0 2px;
}
nav button .ico { font-size: 1.15rem; line-height: 1; }
nav button[aria-current="true"] { color: var(--text); background: var(--surface-2); }
nav .badge {
  position: absolute; transform: translate(20px, -14px);
  background: var(--silver); color: #000; font-size: .62rem; font-weight: 700;
  min-width: 17px; height: 17px; border-radius: 9px; padding: 0 5px;
  display: grid; place-items: center;
}

/* --- Tab bar with a raised middle -------------------------------------------
 *
 * Both roles get this shape; they differ only in which tab is promoted into
 * it. A porter opens the Queue far more than everything else put together, and
 * a cashier is there to issue requests. Whichever it is gets the centre, the
 * largest target, and the only piece of the bar with real contrast in it —
 * findable one-handed, with a key tag in the other hand.
 */
nav.herobar { display: grid; grid-template-columns: 1fr auto 1fr; }
nav.herobar .side { display: flex; gap: 2px; min-width: 0; }
nav.herobar .side > button { flex: 1; }

nav.herobar .hero {
  position: relative; flex: none; width: 96px;
  /* The label sits at the bottom of the bar in line with the other tabs'; the
     icon above it is positioned, so it can sit up on the bar's edge without
     stretching the bar to fit. */
  justify-content: flex-end; padding-bottom: 7px;
  background: none;
}

/* The bar's own top edge bulges upward here, in the bar's own colour and
   carrying the bar's own hairline around the arc. Not a button sitting on the
   bar — the bar itself pushed up. Its flat bottom overlaps the straight border
   by a pixel so the hairline does not cut across the base of the bump. */
nav.herobar .hero::before {
  content: "";
  position: absolute; left: 50%; transform: translateX(-50%);
  /* 92 wide by 46 high — a true half-circle. Sized and placed so its flat base
     lands exactly on the bar's hairline: one pixel taller and the side walls
     poke through as two ticks below the line. */
  top: -52px; width: 92px; height: 46px;
  border-radius: 92px 92px 0 0;
  background: var(--navbg);
  border: 1px solid var(--line); border-bottom: none;
}

/* White at rest, not just when selected. This is the tab its owner reaches for
   without looking, so it is the one place in the bar that stays at full
   contrast whatever else is open. */
nav.herobar .hero .ico { font-size: 2.8rem; color: #fff; }
nav.herobar .hero .lbl { color: #fff; }

/* Sat so the middle of the glyph lands on the bar's top edge, which is 7px
   above the hero's own top given the bar's 6px of padding and its hairline.
   Neither offset is -7, because it is the INK that has to line up rather than
   the box around it, and a glyph is not centred in its own em box. These are
   per-glyph and measured from the font's metrics, not nudged by eye: the three
   bars of U+2630 sit 6.0px low in their box, the fullwidth plus 1.9px. Change
   either icon and its number has to be measured again. */
nav.herobar .hero .disc {
  position: absolute; left: 50%;
  transform: translate(-50%, -50%);
  display: grid; place-items: center;
}
nav.herobar .hero[data-tab="queue"] .disc { top: -13px; }
nav.herobar .hero[data-tab="issue"] .disc { top:  -9px; }

/* Selected. The bump keeps the bar's fill — the whole point of the shape is
   that it is the bar, not something sitting on it — so the state shows in the
   hairline instead, which brightens. The icon and label do not change: they are
   already as bright as they go. */
nav.herobar .hero[aria-current="true"] { background: none; }
nav.herobar .hero[aria-current="true"]::before { border-color: var(--dim); }

/* The count belongs up in the bump, not trailing the word. It is measured from
   the hero, which means it has to sit OUTSIDE .disc — an absolute child of the
   glyph's box measures from the glyph and follows it around, which threw the
   badge halfway up the screen when the icon grew. It straddles the arc's upper
   right rather than tucking inside: at this size the icon fills the
   half-circle, and a badge within the arc would land on top of it. Centred on
   its own x so a two-digit count grows both ways instead of drifting off. */
nav.herobar .hero .badge {
  position: absolute; left: 72px; top: -54px; right: auto;
  transform: translateX(-50%);
}

.diag {
  margin: 26px 0 0; color: var(--dimmer);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: .66rem; line-height: 1.7; word-break: break-word;
}

/* --- Talking about a car ---------------------------------------------------
   Shown only where there is something to show: a car nobody has said anything
   about looks exactly as it did before. */
.msgcount {
  font-size: .7rem; font-weight: 600; letter-spacing: .02em;
  color: var(--silver); background: var(--surface-2);
  border-radius: 999px; padding: 2px 9px; white-space: nowrap;
}

.chat { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.chatmsg {
  background: var(--surface-2); border-radius: 11px; padding: 9px 12px;
  /* No max-height and no inner scroll. The brief was that the request can grow
     taller to fit the conversation, and a scrollbar inside a card inside a
     scrolling page is a worse way to read six messages than simply being
     longer. */
}
.chathead {
  display: flex; align-items: baseline; gap: 8px;
  font-size: .72rem; margin-bottom: 3px;
}
.chathead .who  { font-weight: 700; color: var(--dim); }
.chathead .when { margin-left: auto; color: var(--dimmer); white-space: nowrap; }
.chatbody { font-size: .95rem; color: var(--text); white-space: pre-wrap;
            overflow-wrap: anywhere; }

.compose { margin-top: 14px; }
.compose textarea {
  width: 100%; resize: vertical; min-height: 62px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 11px; padding: 10px 12px;
  /* 1rem exactly. Below this iOS zooms the page the moment the box takes
     focus, which the swipe-to-message gesture does on purpose — so the
     gesture's whole point came with a zoom every single time. */
  font-size: 1rem;
}
.compose textarea:focus { outline: none; border-color: var(--dim); }
.compose .btn { margin-top: 8px; }

/* On the panel for a car you are holding, the log is the reason the panel is
   allowed to get taller. Keep it visually inside the panel rather than looking
   like a stack of separate cards. */
.mycar .chat { margin: 0 0 14px; }
.mycar .chatmsg { background: rgba(0,0,0,.28); }

/* A heading inside Settings, quieter than the page title. */
.setsub { font-size: .78rem; font-weight: 700; color: var(--dim);
          text-transform: uppercase; letter-spacing: .08em;
          margin: 26px 0 10px; }

h2.title { font-size: 1.35rem; font-weight: 650; margin: 2px 0 14px; letter-spacing: -.01em; }
.sub { color: var(--dimmer); font-size: .85rem; margin: -8px 0 16px; }

/* Ask for the TEXT glyph, twice over. U+FE0E after the character is the
   standard request; font-variant-emoji is the newer CSS spelling of the same
   thing. Only the gear needs it — it is the one icon in the bar that a phone
   would otherwise draw as a colour emoji, which made it the odd one out. */
nav button .ico { font-variant-emoji: text; }

/* --- Swipe left to act ------------------------------------------------------
   Touch only. A porter walking between bays has one hand free, and a swipe is
   easier to land than a button. Tapping still does everything it did. */
.swipe-wrap {
  position: relative; overflow: hidden;
  border-radius: var(--radius); margin-bottom: 11px;
}
.swipe-wrap > .card, .swipe-wrap > .mycar { margin-bottom: 0; position: relative; }
/* The wrapper inherits the spacing its child used to own, or the layout shifts
   by 3px the moment a car is claimed. */
.swipe-wrap[data-swipe="complete"] { margin-bottom: 14px; }
.swipe-action {
  position: absolute; inset: 0; opacity: 0;
  display: flex; align-items: center;
  border-radius: var(--radius);
  font-size: .8rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
}
/* Uncovered by dragging LEFT, so it sits on the right. The action that changes
   the state of the car — claim it, deliver it — and green because of that. */
.swipe-action.end {
  justify-content: flex-end; padding-right: 16px;
  background: #14301f; color: var(--ok);
}
/* Uncovered by dragging RIGHT. Blue rather than green: this one does not
   change anything about the car, it just opens a conversation, and a gesture
   that commits by accident should not look like one that did something. */
.swipe-action.start {
  justify-content: flex-start; padding-left: 16px;
  background: #16233a; color: var(--loc-510);
}
/* Past the commit threshold. Worth being obvious about: releasing here acts,
   releasing before it does nothing. */
.swipe-action.end.armed   { background: #1d5c37; color: #fff; }
.swipe-action.start.armed { background: #23477a; color: #fff; }

/* --- The car you are holding ----------------------------------------------
   Deliberately much larger than a queue card. This is the one thing a porter
   mid-delivery needs on screen, so it takes the top of the Queue rather than
   hiding behind a tab they have to remember to open. */
.mycar {
  cursor: pointer;                 /* the whole panel opens the detail view */
  border: 1px solid var(--line);
  border-left: 5px solid var(--advisor, var(--line));
  border-radius: var(--radius);
  padding: 14px 15px 14px; margin-bottom: 14px;
  background: var(--surface);
  background: color-mix(in srgb, var(--advisor, var(--surface)) 13%, var(--surface));
}
.mycar .top1 { display: flex; align-items: center; gap: 10px; }
.mycar .top1 .age { margin-left: auto; color: var(--dimmer);
                    font-size: .78rem; white-space: nowrap; }
.mycar .mid {
  display: flex; flex-direction: column; align-items: center;
  gap: 7px; padding: 26px 0 24px;
}
.mycar .code { font-size: 2.5rem; }
.mycar .route { font-size: 1rem; }
.mycar .meta2 { color: var(--dimmer); font-size: .76rem; text-align: center;
                margin: -14px 0 16px; }

/* --- Request cards -------------------------------------------------------- */
.card {
  position: relative;
  border: 1px solid var(--line);
  border-left: 5px solid var(--advisor, var(--line));
  border-radius: var(--radius);
  padding: 14px 15px; margin-bottom: 11px;
  display: block; width: 100%; text-align: left;

  /* The whole card carries a wash of the advisor's colour as well as the solid
     strip, so a glance down the queue groups by advisor without reading. Kept
     low — much past this and the body text starts losing contrast against it,
     and the colours stop being distinguishable from each other anyway.
     The first declaration is the fallback for anything without color-mix. */
  background: var(--surface);
  background: color-mix(in srgb, var(--advisor, var(--surface)) 13%, var(--surface));
}
.card:active {
  background: var(--surface-2);
  background: color-mix(in srgb, var(--advisor, var(--surface-2)) 22%, var(--surface-2));
}
/* The card is three bands: small metadata top, the car code and its route in
   the middle, small metadata bottom. The middle band is what a porter reads at
   a glance from a moving start, so it gets the space and the weight. */
.card { display: flex; flex-direction: column; min-height: 148px; padding: 12px 14px; }
.card .row1 { display: flex; align-items: center; gap: 10px; }
.card .age { margin-left: auto; color: var(--dimmer); font-size: .78rem; white-space: nowrap; }

.card .mid {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 5px;
  /* Sits the block slightly above true centre, so the route underneath reads as
     hanging off the code rather than the pair floating in the middle. */
  padding-bottom: 10px;
}
.code {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 2.1rem; font-weight: 700; letter-spacing: .07em; line-height: 1.1;
  /* Monospace on purpose: this is the one string a porter reads off a screen
     and matches against a windscreen. O vs 0 and I vs 1 have to be obvious. */
}

/* --- Route ---------------------------------------------------------------- */
.route {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; flex-wrap: wrap; font-size: .9rem; font-weight: 600;
}
.route .arrow { color: var(--dimmer); font-weight: 400; }
.loc { white-space: nowrap; }

/* Locations are coloured to make the routing rule legible without explaining
   it: 510 and 525 — the two that send a job to the 510 porters — are the two
   blues. Everything else, which goes to the lower lot, is a different family.
   The grouping is doing real work here, not decoration. */
.loc-510       { color: var(--loc-510); }
.loc-525       { color: var(--loc-525); }
.loc-express   { color: var(--loc-express); }
.loc-drive     { color: var(--loc-drive); }
.loc-wash      { color: var(--loc-wash); }
.loc-lower_lot { color: var(--loc-lower_lot); }

.card .row3 {
  display: flex; align-items: center; gap: 8px;
  font-size: .76rem; color: var(--dimmer); min-height: 16px;
}
.card .row3 .porter { margin-left: auto; color: var(--dim); white-space: nowrap; }
.card .row3 .cardnote {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
}
/* A note is the only thing on a card a person wrote deliberately, for the
   porter about to drive this car — "customer waiting in bay 4". Everything
   else on that row is metadata about the request. So it gets full white and a
   size up, while the small print around it stays small print. Same reasoning
   wherever else a note appears, hence .msg.note below. */
.card .row3 .cardnote.note { color: var(--text); font-size: .88rem; }

/* Bigger again on the unclaimed queue. That is the list a porter reads to
   decide which car to take, and it is the only one whose row3 carries nothing
   else — no porter name — so the note has the width to itself.
   It also wraps here, where everywhere else it truncates. At this size a
   single line would cut a real note in half, and making the text bigger only
   to show less of it would defeat the point. Clamped at two lines so cards
   keep a predictable height down the list. */
.card.unclaimed .row3 { align-items: flex-start; }
.card.unclaimed .row3 .cardnote.note {
  font-size: 1.05rem; line-height: 1.3; white-space: normal;
  display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
}

/* The advisor's colour NEVER travels alone — the name rides with it every
   time. Roughly 1 in 12 men cannot reliably separate some of these hues, and
   a queue keyed only on colour is unusable for them. */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: .78rem; color: var(--dim);
}
.chip .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--advisor); flex: none; }
.note { margin-top: 9px; color: var(--dim); font-size: .88rem; }
.meta { margin-top: 8px; color: var(--dimmer); font-size: .76rem; }

.empty { text-align: center; color: var(--dimmer); padding: 56px 20px; }
.empty .big { font-size: 2.4rem; margin-bottom: 10px; opacity: .35; }

/* --- Forms and buttons ---------------------------------------------------- */
label { display: block; font-size: .78rem; color: var(--dim); margin: 16px 0 7px;
        letter-spacing: .07em; text-transform: uppercase; }
/* NOTHING FOCUSABLE MAY SET font-size BELOW 1rem.
   16px is not a style choice on iOS: Safari zooms the page in whenever a
   focused field's text is smaller than that, and it does not zoom back out
   afterwards. These inherit 16px from the `font: inherit` reset above; the
   danger is a rule further down overriding it, which is exactly what happened
   to the message box and the history filters. */
input[type=text], select, textarea {
  width: 100%; min-height: var(--tap); padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
  outline: none; appearance: none;
}
input[type=text]:focus, select:focus, textarea:focus { border-color: var(--silver); }
/* appearance:none strips the native dropdown arrow, leaving a select that looks
   like a plain text field. Put one back, or nobody knows it opens. */
select {
  background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%),
                    linear-gradient(135deg, var(--dim) 50%, transparent 50%);
  background-position: calc(100% - 19px) calc(50% + 2px), calc(100% - 13px) calc(50% + 2px);
  background-size: 6px 6px; background-repeat: no-repeat;
  padding-right: 40px;
}
textarea { min-height: 84px; resize: vertical; }
#car_code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 1.3rem; letter-spacing: .09em; text-transform: uppercase; }

/* Location pickers. Two columns rather than six across: at 375px, six buttons
   would be 57px each, well under a comfortable tap target and too narrow for
   "Lower Lot". Two columns keeps 510/525 paired and Express/Drive paired, which
   is also how they group in practice, and six entries fill three rows exactly. */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg button {
  min-height: var(--tap); border-radius: 11px;
  background: var(--surface); border: 1px solid var(--line); color: var(--dim);
  font-weight: 650; letter-spacing: .03em;
}
/* The selected state, shared by every pick-one control in the app: the location
   picker below, the area and mine/everyone filters, the admin sections, the
   admin date ranges. Near-white on dark rather than a slightly lighter grey —
   the old treatment differed from unselected by about 4% of luminance, which is
   not a state you can read at a glance in daylight. */
.seg button[aria-pressed="true"] { background: var(--silver); color: var(--bg); border-color: var(--silver); }

/* Sub-tabs for the two porter areas. */
.zonebar { display: flex; gap: 6px; margin: 0 0 14px; }
.zonebar button {
  flex: 1; min-height: 42px; border-radius: 10px; font-size: .88rem; font-weight: 600;
  background: var(--surface); border: 1px solid var(--line); color: var(--dimmer);
}
.zonebar button[aria-current="true"] {
  background: var(--silver); color: var(--bg); border-color: var(--silver);
}
.zonebar .n {
  font-size: .82rem; font-weight: 700; margin-left: 6px;
  color: var(--count-on-dark);
}
.zonebar button[aria-current="true"] .n { color: var(--count-on-light); }

.checkrow {
  display: flex; align-items: center; gap: 12px; margin-top: 18px;
  min-height: var(--tap); padding: 10px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 11px;
}
.checkrow input { width: 22px; height: 22px; accent-color: var(--loc-wash); flex: none; }
.checkrow label { margin: 0; text-transform: none; letter-spacing: 0;
                  font-size: .95rem; color: var(--text); }
.checkrow.disabled { opacity: .45; }
.checkhint { color: var(--dimmer); font-size: .78rem; margin: 7px 2px 0; }

.btn {
  display: block; width: 100%; min-height: 56px; border-radius: 12px;
  font-size: 1.02rem; font-weight: 650; margin-top: 10px;
  background: var(--surface-2); color: var(--text); border: 1px solid var(--line);
}
.btn.primary { background: var(--silver); color: #000; border-color: var(--silver); }
/* Delivering a car is the one action on these screens that finishes something,
   and it sits next to Send, which is also a filled button. Same weight, own
   colour, so the two cannot be hit for each other in a hurry. */
.btn.go      { background: var(--ok); color: var(--bg); border-color: var(--ok); }
.btn.danger  { color: var(--danger); }
.btn:disabled { opacity: .45; }

.msg { margin-top: 14px; padding: 12px 14px; border-radius: 11px; font-size: .9rem; }
.msg.err  { background: #2a1416; color: var(--danger); }
.msg.info { background: #1a2029; color: var(--dim); }
.msg.ok   { background: #10231a; color: var(--ok); }
/* Not .msg.info: that carries the app talking to you, which should stay quiet.
   This carries a cashier talking to a porter, which should not. */
.msg.note { background: #1a2029; color: var(--text); font-size: 1rem; }

#hSearch { margin-bottom: 10px; text-transform: uppercase; }
#hSearch::placeholder { text-transform: none; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
/* 1rem, not .88 — see the note on the base rule. Tapping a filter zoomed the
   page in and left it there. */
.filters select { min-height: 44px; font-size: 1rem; padding: 8px 11px; }

/* --- Detail sheet --------------------------------------------------------- */
#sheet {
  /* bottom, not inset:0. When the keyboard is up the sheet has to sit on top of
     it — a fixed element stays anchored to the layout viewport, which the
     keyboard covers, so the message box would open underneath it. --kb is the
     keyboard's height, measured in trackKeyboard(). */
  position: fixed; top: 0; left: 0; right: 0; bottom: var(--kb, 0px);
  z-index: 60;
  background: rgba(0,0,0,.65); backdrop-filter: blur(3px);
  display: flex; align-items: flex-end;
}
#sheet[hidden] { display: none; }
#sheetBody {
  /* 92% OF THE SHEET, not 92vh. The sheet shrinks when the keyboard is up, and
     a cap measured against the whole viewport does not — so the panel stayed
     full height inside a half-height box, and being bottom-aligned it hung off
     the TOP of the screen, taking the message box with it. Measured: 704px of
     panel in a 476px sheet, top edge at -212. As a percentage it tracks the
     sheet, and looks identical when there is no keyboard. */
  width: 100%; max-height: 92%; overflow-y: auto;
  background: var(--bg); border-top: 1px solid var(--line);
  border-radius: 20px 20px 0 0;
  padding: 8px 18px calc(24px + var(--safe-bottom));
  animation: rise .22s ease-out;
  /* Stops iOS rubber-banding the page behind the sheet while dragging it. */
  overscroll-behavior: contain;
}
@keyframes rise { from { transform: translateY(16px); opacity: .4 } }

/* The grip is a promise that the sheet can be dragged down. It has to be one
   the app keeps — see the touch handlers below. A control that looks draggable
   and isn't is worse than no control. */
.grip {
  width: 38px; height: 5px; border-radius: 3px; background: var(--line);
  margin: 6px auto 16px; cursor: grab;
}
/* Widen the target well past the visible bar: a thumb reaching the top of a
   sheet one-handed is not precise, and 5px is nothing. */
.grip::before { content: ""; position: absolute; left: 0; right: 0;
                margin-top: -14px; height: 34px; }
.detail-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
               font-size: 2.3rem; font-weight: 650; letter-spacing: .05em; }
.kv { display: flex; justify-content: space-between; gap: 16px;
      padding: 11px 0; border-bottom: 1px solid var(--line); font-size: .92rem; }
/* The section rule below already closes the list off. Two lines together read
   as a mistake. */
.kv:last-child { border-bottom: none; padding-bottom: 0; }
.kv dt { color: var(--dimmer); flex: none; }
.kv dd { margin: 0; text-align: right; }
dl { margin: 0; }

/* The sheet is four different things stacked up: what the car is and what
   somebody wrote about it, the conversation, the record of who did what, and
   what you can do next. Run together they read as one long column and the eye
   has to go through every line to find the one it came for.
   A rule and some air between them, rather than boxes — the note, the messages
   and the buttons are all boxed already, and boxing the groups too would add
   weight to a screen that has too much of it. */
.dsect { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--line); }
/* The section already sets the gap under its rule. A child bringing its own
   top margin doubles it, which is what put a chasm between the divider and the
   message box. */
.dsect > :first-child { margin-top: 0; }

.status-pill {
  display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; padding: 4px 10px; border-radius: 6px; margin-left: 10px;
  vertical-align: middle;
}
.status-pill.unclaimed { background: #262a31; color: var(--dim); }
.status-pill.claimed   { background: #1f2c22; color: var(--ok); }
.status-pill.complete  { background: #1a2029; color: var(--dimmer); }
.status-pill.cancelled { background: #2a1416; color: var(--danger); }

/* --- Admin ---------------------------------------------------------------- */
.arow {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
}
.arow.inactive { opacity: .5; }
.arow .top { display: flex; align-items: center; gap: 10px; }

/* Staff rows put the name on its own line above the buttons. Sharing a line
   with "Reset code" and "Deactivate" left roughly 130px for a name, so "Test
   Porter Two" broke onto three lines — and real names are longer than that. */
.arow .top.stacked { flex-wrap: wrap; }
.arow .top.stacked .namecell { flex: 1 0 100%; min-width: 0; }
.arow .nm { font-weight: 600; flex: 1; min-width: 0; }

/* The name is editable, so it has to look editable. A tappable thing that
   looks like plain text is a feature nobody finds. */
.nameedit {
  display: flex; align-items: center; gap: 7px;
  padding: 0; text-align: left; color: var(--text); font-weight: 600;
}
.nameedit .pencil { color: var(--dimmer); font-size: .82rem; }
.nameedit:active .pencil { color: var(--text); }
.renaming { display: flex; gap: 8px; align-items: center; width: 100%; }
.renaming input { flex: 1; min-width: 0; min-height: 44px; }
.arow .sub2 { color: var(--dimmer); font-size: .76rem; margin-top: 2px; }

/* Permission toggles. Big enough to hit with a thumb, and labelled — an
   unlabelled grid of switches is how somebody gets the wrong one. */
.perms { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 11px; }
.perm {
  display: flex; align-items: center; gap: 9px; min-height: 44px;
  padding: 6px 11px; border-radius: 9px; font-size: .84rem;
  background: var(--bg); border: 1px solid var(--line); color: var(--dim);
  /* The generic `label` rule uppercases, which suits a two-word field name and
     shouts when the text is a sentence. */
  text-transform: none; letter-spacing: 0;
}
.perm input { width: 19px; height: 19px; accent-color: var(--silver); flex: none; }
.perm.on { color: var(--text); border-color: #3a4049; }

.abtn {
  min-height: 40px; padding: 0 13px; border-radius: 9px; font-size: .84rem;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--dim);
}
.abtn.warn { color: var(--warn); }
.abtn.danger { color: var(--danger); }

.swatch { width: 22px; height: 22px; border-radius: 6px; flex: none; }
.keychar {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 1.15rem; font-weight: 700; width: 30px; text-align: center; flex: none;
}

/* A code is shown exactly once and then never again. It needs to look like
   something to write down, not like a status message. */
.codebox {
  margin-top: 14px; padding: 16px; border-radius: 12px; text-align: center;
  background: #10231a; border: 1px solid #1f4d36;
}
.codebox .big {
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 2.2rem; font-weight: 700; letter-spacing: .18em; color: var(--ok);
}
.codebox .warnline { color: var(--warn); font-size: .8rem; margin-top: 8px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.stat {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 11px; padding: 11px 9px; text-align: center;
}
.stat .v { font-size: 1.25rem; font-weight: 650; }
.stat .k { font-size: .68rem; color: var(--dimmer); text-transform: uppercase;
           letter-spacing: .06em; margin-top: 3px; }

.ranges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.ranges button {
  min-height: 38px; padding: 0 12px; border-radius: 9px; font-size: .82rem;
  background: var(--surface); border: 1px solid var(--line); color: var(--dimmer);
}
.ranges button[aria-pressed="true"] {
  background: var(--silver); color: var(--bg); border-color: var(--silver);
}

.offline {
  position: fixed; left: 12px; right: 12px; z-index: 80;
  bottom: calc(78px + var(--safe-bottom));
  background: #3a2a12; color: var(--warn); border: 1px solid #5a4420;
  border-radius: 11px; padding: 10px 14px; font-size: .86rem; text-align: center;
}
.offline[hidden] { display: none; }
</style>
</head>
<body>

<!-- ========================= LOGIN ========================= -->
<div id="login">
  <img src="logo.png" alt="Autobahn Motors">
  <h1>Porter Dispatch</h1>
  <input id="code" type="text" inputmode="numeric" autocomplete="off"
         maxlength="8" placeholder="········" aria-label="Your 8-digit code">
  <button id="loginBtn">Sign in</button>
  <p id="loginErr" role="alert"></p>
  <p id="version"></p>
</div>

<!-- ========================= APP ========================= -->
<div id="app" hidden>
  <header>
    <div class="who"><b id="whoName"></b><span id="whoRole"></span></div>
    <button id="menuBtn" aria-label="Menu" aria-haspopup="true">&#9776;</button>
  </header>
  <main id="view"></main>
  <nav id="tabs"></nav>
</div>

<!-- Slides in from the right. Everything that is about YOU rather than about a
     car lives here: it is opened rarely, and the space it used to take in the
     header and the tab bar is worth more to the things opened constantly. -->
<div id="menu" hidden>
  <div class="menupanel" role="menu">
    <button data-menu="settings" role="menuitem">Settings</button>
    <button data-menu="admin" role="menuitem" hidden>Admin</button>
    <button data-menu="signout" role="menuitem" class="danger">Sign out</button>
  </div>
</div>

<div class="offline" id="offline" hidden>No connection — showing the last known queue</div>

<div id="sheet" hidden><div id="sheetBody"></div></div>

<script>
/* ===========================================================================
   Configuration

   Both values are public by design and are meant to be here. The publishable
   key is what the app authenticates with before anyone logs in; it grants
   nothing on its own. Every table refuses it — see SECURITY-TESTS.md.

   The key that must never appear in this file, or anywhere in this repo, is
   the secret one. It bypasses every rule in db/schema.sql.
=========================================================================== */
const SUPABASE_URL = "https://txnijhgfitfklyjativk.supabase.co";
const SUPABASE_KEY = "sb_publishable_rJEFL4ZmSL_fWJ2v33rVUg_Ovwcmosw";

const POLL_MS = 3000;          // how often the queue refreshes while on screen

/* How long after touching a form field the app leaves the DOM alone. Long
   enough to type a tag or scroll an open dropdown; short enough that a field
   left focused never stops the screen updating. */
const FIELD_GRACE_MS = 8000;
const DAY_BOUNDARY_HOUR = 3;   // sessions end at 3am, matching app_day_start() in SQL
const STORE = "porter.session.v1";

/* --- State ------------------------------------------------------------- */
let session = null;      // { access_token, refresh_token, expires_at, user, loginAt }
let advisors = [];
let requests = [];
let messages = [];       // every message on a car in the live window
let tab = "queue";
let zone = "510";        // which area sub-tab is showing in Queue / In Progress
let activeMineOnly = true;   // Active tab: only cars this cashier requested
let poller = null;
let lastFetchOk = true;
let lastFieldTouch = 0;        // when a form field was last actually interacted with

/* --- Small helpers ------------------------------------------------------ */
const $ = (id) => document.getElementById(id);

// Everything user-typed goes through this before it touches innerHTML. Car
// codes and notes are free text from a phone; treating them as markup would be
// a stored-XSS hole affecting everyone who opens the queue.
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const isManager = () => !!session?.user && session.user.is_manager;

// Issuing is the only real capability left. Everything else about a car —
// claiming it, delivering it — is open to anyone signed in.
const canIssue  = () => !!session?.user && (session.user.can_issue || session.user.is_manager);

// Claiming is open to everyone, in either area. can_claim_510 and
// can_claim_lower are labels describing where someone normally works; they
// grant nothing. Mirrors app_can_claim_zone() in db/schema.sql, which is the
// authority — this only decides what to draw.
const canClaim     = () => !!session?.user;
const canClaimZone = () => !!session?.user;

/* Which tab bar to draw.
 *
 * Porters get the porter bar: the Queue raised into the middle, because it is
 * the screen they open all day and the one they reach for one-handed while
 * holding a key tag.
 *
 * Everyone else gets the flat bar. canIssue() already means "cashier OR
 * manager", so this covers all three of the cases that should not get the
 * porter bar — a cashier, a manager, and anyone carrying both roles — without
 * a second list of conditions that could drift away from this one. Someone who
 * is both a cashier and a porter issues requests, so they get the cashier bar.
 */
const porterBar = () => !!session?.user && !canIssue();

/* The five locations, in the order cashiers use them. The first four are the
   common ones; wash is the tail. */
/* Order is John's, by how often each is actually used — not alphabetical and
   not grouped by area. The picker renders in this order, so changing it here
   changes it everywhere. */
const LOCATIONS = [
  { id: "510",       label: "510" },
  { id: "lower_lot", label: "Lower Lot" },
  { id: "drive",     label: "Drive" },
  { id: "express",   label: "Express" },
  { id: "525",       label: "525" },
  { id: "wash",      label: "Wash" },
];
const LOC_LABEL = Object.fromEntries(LOCATIONS.map(l => [l.id, l.label]));

const ZONES = [
  { id: "510",       label: "510" },
  { id: "lower_lot", label: "Lower Lot" },
];

// Which area sub-tabs this person gets. Porters see only where they work;
// cashiers and managers see both, because they need the whole picture.
// Everyone sees both areas now, because everyone can work in both. The split
// survives as organisation — a porter standing in the lower lot still wants to
// see the lower lot queue first — not as a restriction.
function visibleZones() {
  return session?.user ? ZONES : [];
}

/* Who a key tag belongs to, for display.
 *
 * Mirrors advisor_for_code() in db/schema.sql, but only for the Issue form's
 * live feedback — what actually gets stored is decided by the database when the
 * request is created. Three distinct outcomes that all look like "no advisor"
 * if you are not careful:
 *
 *   Tow-In   the tag starts with T; the car was towed in
 *   N/A      a three-character tag; no advisor was assigned
 *   Unknown  four characters, first matches nobody — a bad tag, or an advisor
 *            who has not been added yet. Shown in red because it is the one
 *            worth looking at.
 */
const TAG_TOW  = { name: "Tow-In",  color: "#cbd5e1" };
const TAG_NONE = { name: "N/A",     color: "#64748b" };
const TAG_BAD  = { name: "Unknown", color: "#ef4444" };

function advisorForCode(code) {
  const c = String(code || "").trim().toUpperCase();
  // Mirrors the tag_type expression in db/schema.sql, which is the authority.
  // This copy only draws the preview while a cashier is typing; if the two ever
  // disagree, the card would change the moment the request was sent.
  if (c.length === 3) return TAG_TOW;
  if (c.length < 3)   return TAG_NONE;
  if (c[0] === "T")   return TAG_TOW;
  return advisors.find(a => a.key_char === c[0]) || TAG_BAD;
}

// For a stored request, prefer what the database recorded — history is a record
// of who it WAS, and must not shift if a key character is reassigned later.
function advisorOf(r) {
  if (r.advisor) return r.advisor;
  if (r.tag_type === "tow_in") return TAG_TOW;
  if (r.tag_type === "none")   return TAG_NONE;
  return TAG_BAD;
}

/* Renders "510 → Wash → Express".
 *
 * The wash stop is a WAYPOINT, not a destination — that is the whole reason
 * via_wash exists separately. Guarded anyway: the database refuses to set it
 * when an end of the journey is already the wash, so "Wash → Wash" cannot
 * arrive here, but rendering should not depend on that holding. */
function routeHtml(r) {
  const steps = [r.origin, ...(r.via_wash && r.origin !== "wash" && r.destination !== "wash"
                               ? ["wash"] : []), r.destination];
  return steps
    .map(s => `<span class="loc loc-${esc(s)}">${esc(LOC_LABEL[s] || s)}</span>`)
    .join('<span class="arrow">→</span>');
}

/* Does this account belong to a service advisor?
   Checks both lists because the two screens have different ones loaded: the app
   knows the active advisors, the admin dashboard knows all of them. */
function isAdvisorAccount(u) {
  if (!u?.id) return false;
  return advisors.some(a => a.user_id === u.id)
      || adminAdvs.some(a => a.user_id === u.id);
}

function roleLabel(u) {
  const parts = [];
  if (u.is_admin) parts.push("Admin");
  // Advisors are given manager permissions, but "Manager" is not what they are
  // — it is only how the app spells the access they need. Say the job.
  if (isAdvisorAccount(u)) parts.push("Service Advisor");
  else if (u.is_manager) parts.push("Manager");
  if (!u.is_manager && u.can_issue) parts.push("Cashier");

  // Where they normally work. A label, not a permission — anyone can claim in
  // either area — but still worth showing so it is clear who is usually where.
  if (u.can_claim_510 && u.can_claim_lower) parts.push("510 + Lower Lot");
  else if (u.can_claim_510)   parts.push("510 Porter");
  else if (u.can_claim_lower) parts.push("Lower Lot Porter");

  return parts.join(" · ") || "Staff";
}

function ago(iso) {
  const mins = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const h = Math.floor(mins / 60);
  return h < 24 ? `${h}h ${mins % 60}m ago` : `${Math.floor(h / 24)}d ago`;
}

function clock(iso) {
  return new Date(iso).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}

/* "8:58 PM · 44m ago".
   Both, because both get asked at once: the clock time is what you compare
   against a watch or against what somebody just said on the phone, and the
   elapsed time is what tells you whether a car has been sitting too long. */
const stamp = (iso) => `${clock(iso)} · ${ago(iso)}`;

function dayAndClock(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString([], { month: "short", day: "numeric" }) + ", " + clock(iso);
}

/* The instant the current "day" began — the most recent 3am. Mirrors
   app_day_start() in db/schema.sql, which is the authority; this copy only
   decides when to end a session, never what the database will allow. */
function dayStart() {
  const d = new Date();
  d.setHours(DAY_BOUNDARY_HOUR, 0, 0, 0);
  if (Date.now() < d.getTime()) d.setDate(d.getDate() - 1);
  return d.getTime();
}

/* ===========================================================================
   Network
=========================================================================== */
async function api(path, { method = "GET", body, headers = {}, retry = true } = {}) {
  const res = await fetch(SUPABASE_URL + path, {
    method,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + (session?.access_token || SUPABASE_KEY),
      "Content-Type": "application/json",
      ...headers,
    },
    body: body === undefined ? undefined : JSON.stringify(body),
  });

  // An expired access token looks exactly like a permission failure from here,
  // so try one silent refresh before concluding the user must sign in again.
  if (res.status === 401 && retry && session?.refresh_token) {
    if (await refreshSession()) return api(path, { method, body, headers, retry: false });
  }

  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) {
    const err = new Error(data?.message || data?.error || `Request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}

async function refreshSession() {
  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: session.refresh_token }),
    });
    if (!res.ok) return false;
    const d = await res.json();
    session.access_token = d.access_token;
    session.refresh_token = d.refresh_token;
    session.expires_at = d.expires_at;
    saveSession();
    return true;
  } catch { return false; }
}

const saveSession = () => localStorage.setItem(STORE, JSON.stringify(session));

function loadSession() {
  try { session = JSON.parse(localStorage.getItem(STORE) || "null"); } catch { session = null; }
  // One login per day: anything from before the last 3am is over.
  if (session && (!session.loginAt || session.loginAt < dayStart())) session = null;
}

function signOut(reason = "") {
  // Tell the database to stop notifying this device, BEFORE the session goes —
  // the delete needs the token.
  //
  // This is now the fast path rather than the only one. It is fire-and-forget
  // and it can fail: at 3am the access token is an hour stale, so the delete
  // 401s and the row stays. That used to mean a logged-out phone kept being
  // notified; it no longer does, because push_targets() asks whether the device
  // claimed itself today rather than whether anyone deleted it.
  //
  // The browser subscription itself is kept. Signing back in re-claims it
  // silently, so nobody has to tap "turn on notifications" every morning.
  releasePushSubscription();

  session = null;
  localStorage.removeItem(STORE);
  clearInterval(poller); poller = null;
  requests = []; advisors = []; tab = "queue";
  // Per-person view state, not per-device: the next person to sign in on this
  // phone should get the defaults, not inherit the last one's filters.
  activeMineOnly = true; zone = "510";
  $("app").hidden = true;
  $("login").hidden = false;
  $("code").value = "";
  // Being dropped to a blank login screen with no explanation looks like a
  // fault. Say what happened.
  $("loginErr").textContent = reason;
}

/* ===========================================================================
   Login
=========================================================================== */
async function doLogin() {
  const code = $("code").value.trim();
  const err = $("loginErr");
  err.textContent = "";

  if (!/^\d{8}$/.test(code)) { err.textContent = "Enter your 8-digit code."; return; }

  $("loginBtn").disabled = true;
  $("loginBtn").textContent = "Signing in…";
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/login`, {
      method: "POST",
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ code }),
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || "Could not sign in");

    session = { ...d, loginAt: Date.now() };
    saveSession();
    await start();
  } catch (e) {
    err.textContent = e.message;
    $("code").value = "";
    $("code").focus();
  } finally {
    $("loginBtn").disabled = false;
    $("loginBtn").textContent = "Sign in";
  }
}

/* ===========================================================================
   Data
=========================================================================== */
const SELECT =
  "*,advisor:service_advisors(id,name,color,key_char)," +
  "issuer:users!requests_issued_by_fkey(name)," +
  "claimer:users!requests_claimed_by_fkey(name)";

async function loadAdvisors() {
  // user_id comes along so the app can tell that the person signed in IS one of
  // these advisors, which is what puts "Service Advisor" under their name.
  advisors = await api("/rest/v1/service_advisors?select=id,name,color,key_char,user_id" +
                       "&active=is.true&order=sort_order.asc,name.asc");
}

async function loadRequests() {
  // The live queue is everything unfinished, plus enough recent history to fill
  // the History tab without a second round trip. Older history is fetched only
  // when that tab asks for it.
  const since = new Date(Date.now() - 7 * 864e5).toISOString();
  try {
    // DESC with the limit, then sorted back. Ordering ascending and taking 500
    // keeps the OLDEST 500 — so the moment this dealership passes 500 requests
    // in a week, the newest ones silently stop arriving and the queue quietly
    // goes stale. Ordering descending keeps the newest, which is what a limit
    // is for.
    const rows = await api(`/rest/v1/requests?select=${SELECT}` +
      `&or=(status.in.(unclaimed,claimed),created_at.gte.${since})` +
      `&order=created_at.desc&limit=500`);
    // The queue renders in array order and must be oldest first.
    requests = rows.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
    lastFetchOk = true;
  } catch (e) {
    if (e.status === 401) { signOut(); return; }
    lastFetchOk = false;         // keep showing the last good queue
  }
  await loadMessages(since);
  $("offline").hidden = lastFetchOk;
}

/* Messages, in their own request rather than embedded in the one above.
 *
 * Two reasons. Embedding would put a join on the admin screen's all-time
 * history query too, which pulls five thousand rows and needs none of this.
 * And it would make the queue itself fail if this table were missing — a
 * PostgREST select naming an unknown relation is a 400 for the whole query, so
 * shipping the app before the migration would take the board down rather than
 * just leave the messages out.
 *
 * Bounded the same way the queue is: everything said in the last seven days.
 * A message cannot pre-date its request, and requests older than that are not
 * on screen, so nothing visible loses its log.
 */
async function loadMessages(since) {
  try {
    messages = await api("/rest/v1/request_messages" +
      "?select=id,request_id,body,created_at,author:users!request_messages_author_id_fkey(name)" +
      `&created_at=gte.${since}&order=created_at.desc&limit=2000`);
  } catch {
    // Deliberately silent, and deliberately does NOT clear what we already
    // have. The queue is the thing that must not break; a stale or absent
    // message list is a much smaller loss than a blank board.
  }
}

// Newest first, which is the order they are read in.
function msgsFor(id) {
  return messages.filter(m => m.request_id === id)
                 .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
}

/* Re-read the signed-in person's own row on every poll.
 *
 * Two jobs, one request:
 *
 *   Deactivation.  users_select requires app_is_active(), so a deactivated
 *   account gets zero rows back — including for itself. Without this they keep
 *   a working-looking session with empty screens and every action refused,
 *   which reads as the app being broken rather than as being switched off.
 *
 *   Permission changes. Ticking someone's areas or taking away their cashier
 *   box takes effect within a few seconds instead of at their next login,
 *   which for a once-a-day code means tomorrow.
 *
 * Returns "gone" only on a definite empty answer from the server. A network
 * failure returns "unknown" and changes nothing: losing signal in the lot must
 * never sign a porter out mid-delivery.
 */
async function checkSelf() {
  if (!session?.user?.id) return "unknown";
  let rows;
  try {
    rows = await api(`/rest/v1/users?id=eq.${session.user.id}&select=*`);
  } catch {
    return "unknown";
  }
  if (!Array.isArray(rows)) return "unknown";
  if (rows.length === 0) return "gone";

  const fresh = rows[0];
  if (JSON.stringify(fresh) !== JSON.stringify(session.user)) {
    session.user = fresh;
    saveSession();
    return "changed";
  }
  return "ok";
}

/* ===========================================================================
   Push notifications
   ---------------------------------------------------------------------------
   iOS will only do this for an app on the Home Screen — not a Safari tab, on
   any version — and the permission prompt must come from a tap. So this is a
   card the porter presses, never something that happens at startup.
=========================================================================== */
const VAPID_PUBLIC =
  "BAILS8UFrR9WZXmQB0O4tl_dnEvQl52mQt7muNsA7CurRpifK5QcJVolnd7O3lwwFVphvGhFRbq7yAb0eFB9uHM";

let pushOn = false;   // does THIS device have a live subscription saved

const pushSupported = () =>
  "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

// iOS reports standalone through a non-standard property; everything else uses
// the display-mode media query.
const isInstalled = () =>
  window.matchMedia?.("(display-mode: standalone)").matches || navigator.standalone === true;

function urlB64ToBytes(s) {
  const pad = "=".repeat((4 - (s.length % 4)) % 4);
  const raw = atob((s + pad).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}

async function existingSubscription() {
  try {
    const reg = await navigator.serviceWorker.ready;
    return await reg.pushManager.getSubscription();
  } catch { return null; }
}

/* Make sure this device's subscription belongs to whoever is signed in now.
 *
 * Phones get shared. If the previous person's subscription is still attached to
 * the browser, the new person's cars would buzz a device registered to somebody
 * else — and RLS rightly will not let them edit a row they do not own. Simplest
 * correct fix: throw the old subscription away and make a fresh one, which
 * yields a new endpoint the current user can register. The orphaned row is
 * pruned by the notify function the first time the dead endpoint returns 410. */
/* Stop this device receiving pushes, without unsubscribing it.
 *
 * Fire and forget, with the token captured up front: sign-out must not wait on
 * the network, and must work identically when it was triggered by a dead
 * session or a 3am expiry. */
function releasePushSubscription() {
  if (!session?.access_token) return;
  const token = session.access_token;
  existingSubscription().then((sub) => {
    if (!sub) return;
    fetch(`${SUPABASE_URL}/rest/v1/push_subscriptions?endpoint=eq.` +
          encodeURIComponent(sub.endpoint), {
      method: "DELETE",
      headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + token },
    }).catch(() => {});
  }).catch(() => {});
  pushOn = false;
}

async function syncPush() {
  pushOn = false;
  if (!pushSupported() || !session?.user) return;

  const sub = await existingSubscription();
  if (!sub) return;

  let mine = [];
  try {
    mine = await api("/rest/v1/push_subscriptions?select=endpoint,p256dh&endpoint=eq." +
                     encodeURIComponent(sub.endpoint));
  } catch { return; }

  if (Array.isArray(mine) && mine.length) {
    pushOn = true;
    // Say, on the server's clock, that this device is signed in today. That is
    // the whole basis on which it gets notified — see push_targets() in
    // db/schema.sql. Runs on every app start, so a device that is never opened
    // and signed into simply stops being notified after the next 3am, without
    // anything having to reach it to switch it off.
    api("/rest/v1/rpc/claim_push", { method: "POST", body: { p_endpoint: sub.endpoint } })
      .catch(() => {});
    // Subscribed before the keys were stored. Fill them in quietly rather than
    // asking everyone to turn notifications on again — otherwise those devices
    // would keep getting the generic wording forever.
    if (!mine[0].p256dh) {
      await api("/rest/v1/push_subscriptions?endpoint=eq." + encodeURIComponent(sub.endpoint),
                { method: "PATCH", body: subscriptionKeys(sub) }).catch(() => {});
    }
    return;
  }

  // No row for this endpoint. Usually because signing out released it, so claim
  // it back — that restores notifications on sign-in without asking again.
  try {
    await api("/rest/v1/push_subscriptions", {
      method: "POST",
      body: { user_id: session.user.id, endpoint: sub.endpoint, ...subscriptionKeys(sub) },
    });
    pushOn = true;
    return;
  } catch { /* 409: this endpoint belongs to somebody else on a shared phone */ }

  // Only then start over, which yields a new endpoint the current user can own.
  try { await sub.unsubscribe(); } catch { /* already gone */ }
  await subscribePush().catch(() => {});
}

// The device's own keys, which the server needs to encrypt a message to it.
// Without them a push can carry no body at all, so the notification cannot name
// the car.
const subscriptionKeys = (sub) => {
  const k = sub.toJSON?.().keys || {};
  return { p256dh: k.p256dh || null, auth: k.auth || null };
};

async function subscribePush() {
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.subscribe({
    userVisibleOnly: true,                        // iOS requires it; we honour it
    applicationServerKey: urlB64ToBytes(VAPID_PUBLIC),
  });
  await api("/rest/v1/push_subscriptions", {
    method: "POST",
    body: { user_id: session.user.id, endpoint: sub.endpoint, ...subscriptionKeys(sub) },
  });
  pushOn = true;
}

/* Is this an iPhone or iPad?
   Only asked to decide whether installing is a precondition for notifications,
   which is an Apple rule and nobody else's. iPadOS 13 and later report
   themselves as a Mac, so the touch points are what give those away. */
const isIOS = () =>
  /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);

function pushCard() {
  if (!canClaim() || pushOn || !pushSupported()) return "";

  // On iOS installing is not a preference, it is a precondition: Safari will
  // not deliver a push to a tab, only to something on the Home Screen. Saying
  // so beats a permission prompt that silently never appears.
  //
  // Nowhere else works that way. On a computer, and on Android, a tab gets
  // notifications perfectly well — so telling those people to tap Share was
  // instructions for a button they do not have, in front of a feature they
  // could already use. They get the ordinary button below instead.
  if (isIOS() && !isInstalled()) {
    return `<div class="msg info" style="margin-bottom:14px">
      <b>Get alerted about new cars</b><br>
      Add this to your Home Screen first — tap Share, then "Add to Home Screen",
      and open it from the icon. Notifications cannot work in a browser tab.
    </div>`;
  }
  if (Notification.permission === "denied") {
    // Where to undo this is not the same on every platform, and sending
    // somebody to an iOS Settings screen they do not have is the same mistake
    // as the Home Screen advice above.
    return `<div class="msg err" style="margin-bottom:14px">
      Notifications are blocked for this app. ${isIOS()
        ? `Turn them back on in Settings → Notifications → Porter.`
        : `Turn them back on in this site's permissions — the icon at the left
           of the address bar.`}
    </div>`;
  }
  return `<button class="btn" id="enablePush" style="margin:0 0 14px">
            Turn on notifications for new cars
          </button>`;
}

/* Jump to the Queue, from wherever the app happens to be.
 *
 * Called when a notification is tapped. Dismisses an open request sheet too —
 * arriving at the queue with a stale car's details covering it would be worse
 * than not switching at all.
 */
function showQueue() {
  if (!session) return;
  tab = "queue";
  sheetId = null; sheetInline = false;
  $("sheet").hidden = true;
  resetSheetPosition();
  render();
}

/* Did a notification ask for the queue while we were not listening?
 *
 * The worker leaves a flag in a cache rather than relying on postMessage,
 * because on iOS the system frequently foregrounds an installed app without the
 * worker ever finding the window. Checked on startup and every time the app
 * comes back to the foreground, which covers every route in.
 *
 * Ignored if older than a minute: a flag left by a notification tapped last
 * night should not yank someone off the screen they just chose this morning.
 */
async function consumeQueueIntent() {
  try {
    const cache = await caches.open("porter-intent");
    const hit = await cache.match("/__show-queue");
    if (!hit) return;
    await cache.delete("/__show-queue");
    if (Date.now() - Number(await hit.text()) < 60000) showQueue();
  } catch { /* no cache API, nothing to do */ }
}

// Which service worker is actually running. Reported on the sign-in screen so
// "it does not work" can be told apart from "it has not arrived yet".
async function serviceWorkerVersion() {
  if (!("serviceWorker" in navigator)) return null;

  // Wait for a controller rather than checking once. On a first load — and
  // immediately after an update reload — the page runs before the worker has
  // claimed it, so an instant check reports "not installed" about a worker that
  // is perfectly healthy. A diagnostic that lies is worse than none.
  if (!navigator.serviceWorker.controller) {
    await navigator.serviceWorker.ready.catch(() => {});
    if (!navigator.serviceWorker.controller) {
      await new Promise((resolve) => {
        const timer = setTimeout(resolve, 3000);
        navigator.serviceWorker.addEventListener("controllerchange",
          () => { clearTimeout(timer); resolve(); }, { once: true });
      });
    }
  }

  const ctrl = navigator.serviceWorker.controller;
  if (!ctrl) return null;
  return new Promise((resolve) => {
    const ch = new MessageChannel();
    ch.port1.onmessage = (e) => resolve(e.data);
    ctrl.postMessage({ type: "version" }, [ch.port2]);
    setTimeout(() => resolve(null), 1500);
  });
}

async function enablePush() {
  const btn = $("enablePush");
  if (btn) { btn.disabled = true; btn.textContent = "Asking…"; }
  try {
    const permission = await Notification.requestPermission();
    if (permission !== "granted") { render(); return; }
    await subscribePush();
  } catch (e) {
    alert("Could not turn on notifications: " + e.message);
  }
  render();
}

const byStatus = (s) => requests.filter(r => r.status === s);
const myClaims = () => requests.filter(r => r.status === "claimed" && r.claimed_by === session.user.id);

/* ===========================================================================
   Rendering
=========================================================================== */
function tabsFor() {
  const t = [{ id: "queue", label: "Queue", ico: "☰" }];
  t.push({ id: "progress", label: "Active", ico: "◷" });
  if (canIssue()) t.push({ id: "issue", label: "Issue", ico: "＋" });
  t.push({ id: "history", label: "History", ico: "⟲" });
  // Settings is not here any more — it lives in the menu, with the other things
  // you touch once a week rather than once a minute.
  return t;
}

function renderTabs() {
  const list = tabsFor();
  // "admin" is reached from the header, not the tab bar, so it is legitimately
  // absent from this list — don't bounce back to the queue when it is showing.
  // Admin and Settings are reached from the menu, not the bar, so they are
  // legitimately absent from this list — don't bounce back to the queue while
  // one of them is showing.
  const offBar = tab === "admin" || tab === "settings";
  if (!offBar && !list.some(t => t.id === tab)) tab = list[0].id;

  // The queue badge counts every area this person can see, not just the sub-tab
  // they happen to be looking at — otherwise a cashier on the 510 tab would see
  // "3" while five cars waited.
  const mineZones = visibleZones().map(z => z.id);
  const waiting = byStatus("unclaimed").filter(r => mineZones.includes(r.zone)).length;

  const nav = $("tabs");
  nav.className = "herobar";
  nav.innerHTML = heroTabs(list, waiting, heroTab());

  nav.querySelectorAll("button").forEach(b =>
    b.onclick = () => { tab = b.dataset.tab; render(); });

}

// One flat tab. Used as-is by the cashier bar, and for everything either side
// of the disc on the porter bar.
function tabBtn(t, waiting) {
  const badge = (t.id === "queue" && waiting) ? `<span class="badge">${waiting}</span>` : "";
  return `<button data-tab="${t.id}" aria-current="${t.id === tab}">
            <span class="ico">${t.ico}</span>${esc(t.label)}${badge}
          </button>`;
}

/* The tab each role reaches for most, and so the one that gets the middle.
   A porter opens the Queue all day; a cashier's job is issuing requests. The
   cashier bar always has an Issue tab to promote, because the only people on
   that bar are the ones who can issue. */
const heroTab = () => porterBar() ? "queue" : "issue";

/* One tab raised into the half-circle in the middle, the rest split either
   side: History and Settings on the right, everything else on the left. The
   two sides are equal halves, so the bump lands dead centre whether there are
   one or two tabs beside it. */
function heroTabs(list, waiting, heroId) {
  const hero  = list.find(t => t.id === heroId);
  const right = list.filter(t => t.id === "history" || t.id === "settings");
  const left  = list.filter(t => t.id !== heroId && !right.includes(t));

  return `<div class="side">${left.map(t => tabBtn(t, waiting)).join("")}</div>` +
    (hero ? `
      <button class="hero" data-tab="${hero.id}" aria-current="${hero.id === tab}">
        <span class="disc"><span class="ico">${hero.ico}</span></span>
        ${hero.id === "queue" && waiting ? `<span class="badge">${waiting}</span>` : ""}
        <span class="lbl">${esc(hero.label)}</span>
      </button>` : "") +
    `<div class="side">${right.map(t => tabBtn(t, waiting)).join("")}</div>`;
}

function card(r, opts = {}) {
  const adv = advisorOf(r);
  const color = adv.color;
  // A count, not the messages. The queue is a list you scan; carrying the
  // conversation here would bury the car code it exists to show. Tapping in
  // gets the whole thing.
  const n = msgsFor(r.id).length;
  const porter = r.claimer?.name ? `<span class="porter">${esc(r.claimer.name)}</span>` : "";
  // Status wins over the note wherever there is one. In History that line is
  // what you are scanning — "Delivered by Mark · 42 min" — and letting a note
  // displace it meant the cards carrying the most context were the only ones
  // not telling you what happened. The note is still on the request itself.
  //
  // The queue and In Progress pass no status, so the note shows there, which is
  // where it earns its place: "Mrs Chen - bay 4" is what a porter needs before
  // setting off.
  const bottom = opts.meta
    ? `<span class="cardnote">${esc(opts.meta)}</span>`
    : (r.note ? `<span class="cardnote note">${esc(r.note)}</span>` : "");

  return `
    <button class="card ${r.status}" data-id="${r.id}" style="--advisor:${esc(color)}">
      <div class="row1">
        <span class="chip"><span class="dot"></span>${esc(adv.name)}</span>
        ${n ? `<span class="msgcount">${n} message${n > 1 ? "s" : ""}</span>` : ""}
        <span class="age">${esc(opts.time || stamp(r.created_at))}</span>
      </div>
      <div class="mid">
        <div class="code">${esc(r.car_code)}</div>
        <div class="route">${routeHtml(r)}</div>
      </div>
      <div class="row3">${bottom}${porter}</div>
    </button>`;
}

/* The conversation about one car, newest first.
   Newest first because the last thing said is the thing that changes what you
   do next; a porter reading this has usually already seen the rest. */
function messageLog(msgs) {
  if (!msgs.length) return "";
  return `<div class="chat">` + msgs.map(m => `
    <div class="chatmsg">
      <div class="chathead">
        <span class="who">${esc(m.author?.name || "Someone")}</span>
        <span class="when">${esc(dayAndClock(m.created_at))}</span>
      </div>
      <div class="chatbody">${esc(m.body)}</div>
    </div>`).join("") + `</div>`;
}

/* Wraps something swipeable so there is an action sitting behind it.
   The wrapper clips, the child slides, and the label underneath is revealed —
   no extra DOM anywhere it isn't used, because only the Queue swipes. */
function swipeWrap(inner, label, action) {
  return `<div class="swipe-wrap"${action ? ` data-swipe="${action}"` : ""}>
            ${action ? `<div class="swipe-action end">${esc(label)}</div>` : ""}
            <div class="swipe-action start">Message</div>
            ${inner}</div>`;
}

/* The area sub-tabs above the Queue and In Progress lists.
   Drawn only when there is a choice to make — a porter who works one area gets
   no switcher, because there is nothing to switch to. */
function zoneBar(counts) {
  const zones = visibleZones();
  if (zones.length < 2) return "";
  if (!zones.some(z => z.id === zone)) zone = zones[0].id;
  return `<div class="zonebar">` + zones.map(z =>
    `<button data-zone="${z.id}" aria-current="${z.id === zone}">${esc(z.label)}` +
    (counts[z.id] ? `<span class="n">${counts[z.id]}</span>` : "") +
    `</button>`).join("") + `</div>`;
}

// Requests in the area currently being viewed. A porter with one area sees
// theirs; anyone with both sees whichever sub-tab is selected.
function inZone(list) {
  const zones = visibleZones();
  const active = zones.some(z => z.id === zone) ? zone : zones[0]?.id;
  return list.filter(r => r.zone === active);
}

/* Mine / everyone's, for people who issue requests.
   Defaults to Mine: a cashier asking "where is my car" is the common question,
   and the whole board is the exception. */
function mineBar(all) {
  if (!canIssue()) return "";
  const mine = all.filter(r => r.issued_by === session.user.id).length;
  const pill = (on, key, label, count) =>
    `<button data-mine="${key}" aria-current="${on}">${esc(label)}` +
    (count ? `<span class="n">${count}</span>` : "") + `</button>`;
  return `<div class="zonebar">` +
    pill(activeMineOnly,  "1", "My requests", mine) +
    pill(!activeMineOnly, "0", "Everyone's", all.length) +
    `</div>`;
}

function bindZoneBar() {
  $("view").querySelectorAll("[data-zone]").forEach(b =>
    b.onclick = () => { zone = b.dataset.zone; render(); });
}

/* The car (or cars) this person is holding, rendered large at the top of the
   Queue. One panel each — somebody holding three cars scrolls past three of
   them to reach the queue, which is the correct order of business. */
function myCarPanels(mine) {
  if (!mine.length) return "";

  const heading = mine.length === 1
    ? "Your car"
    : `Your cars · ${mine.length}`;

  return `<h2 class="title">${esc(heading)}</h2>` + mine.map(r => {
    const adv = advisorOf(r);
    return swipeWrap(`
      <div class="mycar" data-detail="${r.id}" style="--advisor:${esc(adv.color)}">
        <div class="top1">
          <span class="chip"><span class="dot"></span>${esc(adv.name)}</span>
          <span class="age">claimed ${esc(stamp(r.claimed_at))}</span>
        </div>
        <div class="mid">
          <div class="code">${esc(r.car_code)}</div>
          <div class="route">${routeHtml(r)}</div>
        </div>
        ${r.note ? `<div class="msg note" style="margin:0 0 14px">${esc(r.note)}</div>` : ""}
        ${messageLog(msgsFor(r.id))}
        <div class="meta2">Requested by ${esc(r.issuer?.name || "—")} ·
          ${esc(ago(r.created_at))}</div>
        <button class="btn go" data-car="${r.id}" data-do="complete">Mark delivered</button>
      </div>`, "Delivered", "complete");
  }).join("");
}

function bindMyCarPanels() {
  // The whole panel is the way in to everything it does not show: the full
  // history of the request, the actions a manager has, and the box for writing
  // a message. Composing deliberately lives there and not here — this panel is
  // rebuilt by the three-second poll, and a half-typed message inside something
